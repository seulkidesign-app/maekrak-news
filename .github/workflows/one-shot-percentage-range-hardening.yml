name: one-shot-percentage-range-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          const { auditEventAccuracy } = await import('./lib/accuracy.ts');
          const article = (title, source) => ({
            title, description: title, source, link: 'https://example.com/story',
            publishedAt: '2026-08-31T02:00:00Z', category: '경제', scope: 'world',
            sourceType: 'aggregated', sourceRole: source === 'Reuters' ? 'wire' : 'international',
          });
          const event = {
            id: 'range-repro', title: 'Inflation range', category: '경제', scope: 'world', summary: '',
            publishedAt: '2026-08-31T02:00:00Z', dayStatus: 'today',
            articles: [
              article('Inflation expected at 3-4%', 'Reuters'),
              article('Inflation expected between 3% and 4%', 'BBC'),
            ],
            sourceCount: 2, importanceScore: 8, whySelected: [], briefWhy: 'economy', briefWatch: 'follow-up',
          };
          const audit = auditEventAccuracy(event);
          if (!audit.headlineNumberDifference) throw new Error('percentage range false-positive no longer reproduces');
          console.log('REPRODUCED: equivalent percentage ranges produce a numeric disagreement warning');
          console.log(JSON.stringify(audit.numberExamples));
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          let source = readFileSync('lib/accuracy.ts', 'utf8');
          const fraction = 'function fractionShareValues(title:string){const values:Array<{range:[number,number];canonical:string}>=[];for(const match of title.matchAll(/\\b(\\d+)\\s*\\/\\s*(\\d+)\\s+(?=of\\b)/gi)){const numerator=Number(match[1]),denominator=Number(match[2]);if(!Number.isInteger(numerator)||!Number.isInteger(denominator)||denominator<=0||numerator<0||numerator>denominator)continue;const percentage=numerator*100/denominator;if(!Number.isInteger(percentage))continue;const start=match.index??0;values.push({range:[start,start+match[0].length],canonical:`${percentage}%`});}return values;}';
          if (!source.includes(fraction)) throw new Error('fraction helper anchor not found');
          const rangeHelper = `function percentageRangeValues(title:string){const values:Array<{range:[number,number];canonicals:string[]}>=[];const patterns=[/\\b([+\\-−]?\\d+(?:[.,]\\d+)*)\\s*(?:[-–—~∼〜]|to)\\s*([+\\-−]?\\d+(?:[.,]\\d+)*)\\s*(?:%|percent\\b|퍼센트)/gi,/\\bbetween\\s+([+\\-−]?\\d+(?:[.,]\\d+)*)\\s*(?:%|percent\\b)?\\s+and\\s+([+\\-−]?\\d+(?:[.,]\\d+)*)\\s*(?:%|percent\\b)/gi];for(const pattern of patterns){for(const match of title.matchAll(pattern)){const left=canonicalNumber(\`${'${match[1]}'}%\`),right=canonicalNumber(\`${'${match[2]}'}%\`);if(!left||!right)continue;const start=match.index??0;values.push({range:[start,start+match[0].length],canonicals:[left,right].sort((a,b)=>a.localeCompare(b,"en",{numeric:true}))});}}return values;}`;
          source = source.replace(fraction, fraction + '\n' + rangeHelper);

          const oldPrelude = 'function headlineNumbers(title:string):string[]{const matcher=/(?:[$€£₩¥]|\\b(?:USD|EUR|GBP|KRW|JPY)\\b\\s*)?[+\\-−]?\\d+(?:[.,]\\d+)*(?:\\s*(?:percentage\\s+points?|percent(?!age)|퍼센트\\s*포인트|퍼센트|%|basis\\s+points?|bps?|bp|베이시스\\s*포인트|명|thousand|million|billion|trillion|천|만|백만|억|조))?(?:(?:\\s*(?:dollars?|euros?|won|yen|degrees?\\s+(?:celsius|fahrenheit)|celsius|fahrenheit|kilometers?|kilometres?|km|meters?|metres?|miles?|mi|kilograms?|kg|grams?|pounds?|lbs|lb)\\b)|(?:\\s*(?:원|달러|유로|엔))|(?:\\s*°\\s*[CF]\\b))?/gi;const fractionShares=fractionShareValues(title);const cleaned:string[]=fractionShares.map(i=>i.canonical);const ignoredRanges=[...clockTimeRanges(title),...calendarDateRanges(title),...fractionShares.map(i=>i.range)];';
          const newPrelude = 'function headlineNumbers(title:string):string[]{const matcher=/(?:[$€£₩¥]|\\b(?:USD|EUR|GBP|KRW|JPY)\\b\\s*)?[+\\-−]?\\d+(?:[.,]\\d+)*(?:\\s*(?:percentage\\s+points?|percent(?!age)|퍼센트\\s*포인트|퍼센트|%|basis\\s+points?|bps?|bp|베이시스\\s*포인트|명|thousand|million|billion|trillion|천|만|백만|억|조))?(?:(?:\\s*(?:dollars?|euros?|won|yen|degrees?\\s+(?:celsius|fahrenheit)|celsius|fahrenheit|kilometers?|kilometres?|km|meters?|metres?|miles?|mi|kilograms?|kg|grams?|pounds?|lbs|lb)\\b)|(?:\\s*(?:원|달러|유로|엔))|(?:\\s*°\\s*[CF]\\b))?/gi;const fractionShares=fractionShareValues(title);const percentageRanges=percentageRangeValues(title);const cleaned:string[]=[...fractionShares.map(i=>i.canonical),...percentageRanges.flatMap(i=>i.canonicals)];const ignoredRanges=[...clockTimeRanges(title),...calendarDateRanges(title),...fractionShares.map(i=>i.range),...percentageRanges.map(i=>i.range)];';
          if (!source.includes(oldPrelude)) throw new Error('headline number prelude anchor not found');
          source = source.replace(oldPrelude, newPrelude);
          writeFileSync('lib/accuracy.ts', source);
          EOF

          cat > scripts/percentage-range-abuse.mjs <<'EOF'
          const failures = [];
          const passes = [];
          const { auditEventAccuracy } = await import('../lib/accuracy.ts');
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const article = (title, source) => ({
            title, description: title, source, link: 'https://example.com/story',
            publishedAt: '2026-08-31T02:00:00Z', category: '경제', scope: 'world',
            sourceType: 'aggregated', sourceRole: source === 'Reuters' ? 'wire' : 'international',
          });
          const event = (a, b) => ({
            id: 'range', title: a.title, category: '경제', scope: 'world', summary: '',
            publishedAt: '2026-08-31T02:00:00Z', dayStatus: 'today', articles: [a, b],
            sourceCount: 2, importanceScore: 8, whySelected: [], briefWhy: 'economy', briefWatch: 'follow-up',
          });
          const audit = (left, right) => auditEventAccuracy(event(article(left, 'Reuters'), article(right, 'BBC')));
          check('hyphen range equals explicit between range', !audit('Inflation expected at 3-4%', 'Inflation expected between 3% and 4%').headlineNumberDifference);
          check('en-dash range equals explicit endpoints', !audit('Inflation expected at 3–4%', 'Inflation expected at 3% to 4%').headlineNumberDifference);
          check('tilde range equals explicit endpoints', !audit('물가 상승률 3~4% 전망', '물가 상승률 3%~4% 전망').headlineNumberDifference);
          check('range endpoints remain visible as percentages', audit('Inflation expected at 3-4%', 'Inflation expected between 3% and 4%').numberExamples.every((item) => item.values.includes('3%') && item.values.includes('4%')));
          check('different ranges still trigger disagreement', audit('Inflation expected at 3-4%', 'Inflation expected between 4% and 5%').headlineNumberDifference);
          check('single signed percentage semantics remain intact', audit('Inflation falls -3%', 'Inflation falls 3%').headlineNumberDifference);
          console.log(`Percentage range abuse: ${passes.length} passed / ${failures.length} failed`);
          passes.forEach((name) => console.log(`PASS  ${name}`));
          failures.forEach((name) => console.error(`FAIL  ${name}`));
          if (failures.length) process.exit(1);
          EOF

          node scripts/percentage-range-abuse.mjs
          node scripts/number-magnitude-abuse.mjs
          node scripts/unit-ambiguity-abuse.mjs
          node scripts/calendar-date-number-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build

          git add lib/accuracy.ts scripts/percentage-range-abuse.mjs
          git commit -m "Normalize equivalent percentage range notation"
          git push origin HEAD:main
