name: one-time-alphanumeric-placeholder-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch alphanumeric placeholder trust gap
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('lib/source-normalize.ts')
          text = source.read_text()
          old = 'const PLACEHOLDER_OUTLET = /^(?:unknown|unknown source|source unknown|unverified source|source unavailable|unavailable source|n a|na|none|null|출처 없음|출처 불명|출처 미상|알 수 없음|미상|확인 불가)(?:\\s*(?:\\d+|[A-Za-z]))?$/i;'
          new = 'const PLACEHOLDER_OUTLET = /^(?:unknown|unknown source|source unknown|unverified source|source unavailable|unavailable source|n a|na|none|null|출처 없음|출처 불명|출처 미상|알 수 없음|미상|확인 불가)(?:\\s*(?:\\d+|[A-Za-z]|(?=[A-Za-z0-9]*[A-Za-z])(?=[A-Za-z0-9]*\\d)[A-Za-z0-9]+))?$/i;'
          if new not in text:
            if old not in text:
              raise SystemExit('placeholder regex not found')
            text = text.replace(old, new, 1)
          source.write_text(text)

          test = Path('scripts/ascii-placeholder-suffix-abuse.mjs')
          text = test.read_text()
          marker = 'console.log(`\\nASCII placeholder suffix abuse: ${passes.length} passed / ${failures.length} failed`);'
          block = '''const alphanumericPlaceholders = [
            "Unknown source A1", "Unknown source B2", "Unknown v2", "Source unavailable r3",
            "Unverified source 2026A", "N/A x9", "None build7", "null id42",
            "출처 없음 A1", "출처 불명 v2", "출처 미상 2026B", "미상 id7", "확인 불가 r4",
          ];

          check("mixed alphanumeric placeholder aliases collapse to unverified source",
            alphanumericPlaceholders.every((value) => canonicalSourceName(value) === "Unverified source"));
          check("mixed alphanumeric placeholders cannot manufacture outlet diversity",
            canonicalOutletCount(alphanumericPlaceholders.map((source) => ({ source }))) === 1);
          const benignAlphanumericOutlets = ["Studio 54", "Channel A1", "Newsroom 2026A"];
          check("ordinary alphanumeric outlet names remain preserved",
            benignAlphanumericOutlets.every((value) => canonicalSourceName(value) !== "Unverified source") &&
            canonicalOutletCount(benignAlphanumericOutlets.map((source) => ({ source }))) === 3);
          check("real outlets remain distinct from mixed alphanumeric placeholders",
            canonicalOutletCount([{ source: "Reuters" }, ...alphanumericPlaceholders.map((source) => ({ source }))]) === 2);

          '''
          if 'mixed alphanumeric placeholder aliases collapse to unverified source' not in text:
            if marker not in text:
              raise SystemExit('ASCII regression insertion marker not found')
            text = text.replace(marker, block + marker, 1)
          test.write_text(text)
          PY
          git config user.name "maekrak-redteam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/source-normalize.ts scripts/ascii-placeholder-suffix-abuse.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: collapse alphanumeric source placeholders"
          git push origin HEAD:main
