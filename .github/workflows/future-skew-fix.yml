name: one-shot-future-skew-fix

on:
  push:
    paths:
      - .github/workflows/future-skew-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clamp tolerated future publication skew
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()
          old = '''  if (!Number.isFinite(time)) return "";\n  if (time > now + 2 * 60_000) return "";\n  return parsed.toISOString();'''
          new = '''  if (!Number.isFinite(time)) return "";\n  if (time > now + 2 * 60_000) return "";\n  if (time > now) return new Date(now).toISOString();\n  return parsed.toISOString();'''
          if old not in text:
              raise SystemExit('target safePublishedAt block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/news.ts
          git commit -m "fix: clamp tolerated future publication skew"
          git push origin HEAD:main
