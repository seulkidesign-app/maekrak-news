name: event-id-collision-fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/event-id-collision-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply event integrity hardening
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          news = Path("lib/news.ts")
          text = news.read_text()

          old_import = 'import { XMLParser } from "fast-xml-parser";\n'
          new_import = 'import { createHash } from "node:crypto";\nimport { XMLParser } from "fast-xml-parser";\n'
          if 'from "node:crypto"' not in text:
              assert old_import in text
              text = text.replace(old_import, new_import, 1)

          old_hash = dedent('''\
          function stableHash(value: string) {
            let hash = 2166136261;
            for (let index = 0; index < value.length; index += 1) {
              hash ^= value.charCodeAt(index);
              hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(36);
          }''')
          new_hash = dedent('''\
          function stableHash(value: string) {
            return createHash("sha256").update(value, "utf8").digest("hex").slice(0, 24);
          }''')
          if old_hash in text:
              text = text.replace(old_hash, new_hash, 1)

          majority_marker = dedent('''\
          function majority<T extends string>(values: T[], fallback: T): T {
            const counts = new Map<T, number>();
            values.forEach((value) => counts.set(value, (counts.get(value) ?? 0) + 1));
            return [...counts.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] ?? fallback;
          }
          ''')
          balanced = majority_marker + dedent('''\
          function sourceBalancedMajority<T extends string>(articles: NewsItem[], select: (article: NewsItem) => T, fallback: T): T {
            const bySource = new Map<string, T[]>();
            for (const article of articles) {
              const source = canonicalSourceName(article.source);
              const values = bySource.get(source) ?? [];
              values.push(select(article));
              bySource.set(source, values);
            }
            const sourceVotes = [...bySource.values()].map((values) => majority(values, fallback));
            return majority(sourceVotes, fallback);
          }
          ''')
          if 'function sourceBalancedMajority' not in text:
              assert majority_marker in text
              text = text.replace(majority_marker, balanced, 1)

          text = text.replace('const category = majority(sorted.map((article) => article.category), primary.category);', 'const category = sourceBalancedMajority(sorted, (article) => article.category, primary.category);')
          text = text.replace('const scope = majority(sorted.map((article) => article.scope), primary.scope);', 'const scope = sourceBalancedMajority(sorted, (article) => article.scope, primary.scope);')

          export_marker = "  hasProperNameConflict,\n  sameEvent,\n};"
          export_repl = "  hasProperNameConflict,\n  sameEvent,\n  stableEventId,\n  sourceBalancedMajority,\n};"
          if export_marker in text:
              text = text.replace(export_marker, export_repl, 1)
          elif 'sourceBalancedMajority,' not in text:
              raise AssertionError('test export marker not found')
          news.write_text(text)

          Path("scripts/event-id-collision-abuse.mjs").write_text(dedent(r'''
          const failures = [];
          const passes = [];
          function check(name, condition) { condition ? passes.push(name) : failures.push(name); }
          const { __test } = await import("../lib/news.ts");
          function article(title) {
            return { title, description: title, source: "Example News", link: `https://example.com/${encodeURIComponent(title)}`, publishedAt: "2026-08-28T00:00:00.000Z", category: "세계", scope: "world", sourceType: "direct", sourceRole: "other" };
          }
          const first = [article("clkabuym fverifen")];
          const second = [article("nkhbrcyr oltwxqyh")];
          const firstId = __test.stableEventId(first);
          const secondId = __test.stableEventId(second);
          check("known 32-bit collision pair now receives distinct event IDs", firstId !== secondId);
          check("event IDs use a 96-bit digest", /^evt_[0-9a-f]{24}$/.test(firstId) && /^evt_[0-9a-f]{24}$/.test(secondId));
          check("event ID remains deterministic", __test.stableEventId(first) === firstId);
          console.log(`Event ID collision abuse: ${passes.length} passed / ${failures.length} failed`);
          failures.forEach((name) => console.error(`FAIL  ${name}`));
          if (failures.length) process.exit(1);
          ''').lstrip())

          Path("scripts/source-flood-abuse.mjs").write_text(dedent(r'''
          const failures = [];
          const passes = [];
          function check(name, condition) { condition ? passes.push(name) : failures.push(name); }
          const { __test } = await import("../lib/news.ts");
          function article(source, category, scope = "world") {
            return { title: `${source} update ${Math.random()}`, description: "", source, link: `https://example.com/${encodeURIComponent(source)}`, publishedAt: "2026-08-28T00:00:00.000Z", category, scope, sourceType: "direct", sourceRole: "other" };
          }
          const flooded = [
            ...Array.from({ length: 8 }, () => article("Flood News", "경제")),
            article("Outlet B", "정치"),
            article("Outlet C", "정치"),
          ];
          check("one outlet cannot outvote two independent outlets by article volume", __test.sourceBalancedMajority(flooded, (item) => item.category, "세계") === "정치");
          const scopeFlood = [
            ...Array.from({ length: 9 }, () => article("Flood News", "세계", "domestic")),
            article("Outlet B", "세계", "world"),
            article("Outlet C", "세계", "world"),
          ];
          check("one outlet cannot flip event scope by duplicate volume", __test.sourceBalancedMajority(scopeFlood, (item) => item.scope, "world") === "world");
          console.log(`Source flood abuse: ${passes.length} passed / ${failures.length} failed`);
          failures.forEach((name) => console.error(`FAIL  ${name}`));
          if (failures.length) process.exit(1);
          ''').lstrip())

          ci = Path(".github/workflows/adversarial-e2e.yml")
          ci_text = ci.read_text()
          marker = "      - name: Source-link trust abuse\n        run: node scripts/source-link-abuse.mjs\n"
          addition = marker
          if "Event ID collision abuse" not in ci_text:
              addition += "      - name: Event ID collision abuse\n        run: node scripts/event-id-collision-abuse.mjs\n"
          if "Source flood abuse" not in ci_text:
              addition += "      - name: Source flood abuse\n        run: node scripts/source-flood-abuse.mjs\n"
          if addition != marker:
              assert marker in ci_text
              ci_text = ci_text.replace(marker, addition, 1)
          ci.write_text(ci_text)

          Path(".github/workflows/event-id-collision-fix.yml").unlink()
      - run: npm install --no-audit --no-fund
      - name: Event ID collision regression
        run: node scripts/event-id-collision-abuse.mjs
      - name: Source flood regression
        run: node scripts/source-flood-abuse.mjs
      - name: Full content abuse regression
        run: node scripts/content-abuse.mjs
      - name: Production build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden event identity and source-balanced voting"
          git push origin HEAD:main
      - name: Dispatch full adversarial CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/adversarial-e2e.yml/dispatches \
            -d '{"ref":"main"}'
