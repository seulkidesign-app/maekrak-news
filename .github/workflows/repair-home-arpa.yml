name: repair-home-arpa

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-home-arpa.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch public-link trust boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()
          old = 'if (host === "localhost" || host.endsWith(".localhost") || host.endsWith(".local") || host === "localtest.me" || host.endsWith(".localtest.me") || host === "lvh.me" || host.endsWith(".lvh.me")) return true;'
          new = 'if (host === "localhost" || host.endsWith(".localhost") || host.endsWith(".local") || host === "home.arpa" || host.endsWith(".home.arpa") || host === "localtest.me" || host.endsWith(".localtest.me") || host === "lvh.me" || host.endsWith(".lvh.me")) return true;'
          if old not in text:
              raise SystemExit('expected isPrivateHostname guard not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/repair-home-arpa.yml
      - name: Commit fix and self-cleanup
        run: |
          git config user.name "seulkidesign-app"
          git config user.email "seulki.design@gmail.com"
          git add lib/news.ts .github/workflows/repair-home-arpa.yml
          git commit -m "fix: reject home.arpa local-network links"
          git push origin HEAD:main
