name: adversarial-e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Adversarial content pipeline
        run: node scripts/content-abuse.mjs
      - name: High-impact lexical false-positive abuse
        run: node scripts/high-impact-lexical-abuse.mjs
      - name: Feed boundary abuse
        run: node scripts/feed-boundary-abuse.mjs
      - name: Number magnitude abuse
        run: node scripts/number-magnitude-abuse.mjs
      - name: Unicode numeric glyph abuse
        run: node scripts/unicode-numeric-glyph-abuse.mjs
      - name: Percentage-point semantic abuse
        run: node scripts/percentage-point-abuse.mjs
      - name: Unit ambiguity abuse
        run: node scripts/unit-ambiguity-abuse.mjs
      - name: Clock-time number abuse
        run: node scripts/clock-time-number-abuse.mjs
      - name: Calendar-date number abuse
        run: node scripts/calendar-date-number-abuse.mjs
      - name: Timezone-less publication timestamp abuse
        run: node scripts/timezone-less-published-at-abuse.mjs
      - name: Publication precision spoofing abuse
        run: node scripts/publication-precision-abuse.mjs
      - name: Ambiguous timezone abbreviation abuse
        run: node scripts/ambiguous-timezone-abbreviation-abuse.mjs
      - name: Timestamp poisoning abuse
        run: node scripts/timestamp-abuse.mjs
      - name: Template headline collision abuse
        run: node scripts/template-collision-abuse.mjs
      - name: Cluster bridge poisoning abuse
        run: node scripts/cluster-bridge-abuse.mjs
      - name: Unverified cluster poisoning abuse
        run: node scripts/unverified-cluster-poisoning-abuse.mjs
      - name: Directional role reversal abuse
        run: node scripts/directional-role-reversal-abuse.mjs
      - name: Korea entity boundary abuse
        run: node scripts/korea-entity-boundary-abuse.mjs
      - name: IPv6 URL boundary abuse
        run: node scripts/ipv6-boundary-abuse.mjs
      - name: Outlet case inflation abuse
        run: node scripts/outlet-case-abuse.mjs
      - name: Outlet punctuation inflation abuse
        run: node scripts/outlet-punctuation-abuse.mjs
      - name: Unicode punctuation outlet inflation abuse
        run: node scripts/unicode-punctuation-outlet-abuse.mjs
      - name: Default-ignorable outlet inflation abuse
        run: node scripts/default-ignorable-outlet-abuse.mjs
      - name: Trusted-brand homoglyph outlet abuse
        run: node scripts/trusted-brand-homoglyph-abuse.mjs
      - name: Extended trusted-brand homoglyph abuse
        run: node scripts/extended-trusted-brand-homoglyph-abuse.mjs
      - name: Armenian trusted-brand homoglyph abuse
        run: node scripts/armenian-trusted-brand-homoglyph-abuse.mjs
      - name: Combining-mark trusted-brand outlet abuse
        run: node scripts/combining-mark-outlet-abuse.mjs
      - name: Combining-overlay outlet inflation abuse
        run: node scripts/combining-overlay-outlet-abuse.mjs
      - name: Generic homoglyph outlet inflation abuse
        run: node scripts/generic-homoglyph-outlet-inflation-abuse.mjs
      - name: Benign mixed-script outlet false-positive abuse
        run: node scripts/benign-mixed-script-outlet-abuse.mjs
      - name: Placeholder outlet inflation abuse
        run: node scripts/placeholder-outlet-abuse.mjs
      - name: Numbered placeholder outlet inflation abuse
