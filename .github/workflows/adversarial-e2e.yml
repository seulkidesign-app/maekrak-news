name: adversarial-e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply tested source-link trust patch
        run: python scripts/apply-source-link-hotfix.py
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Adversarial content pipeline
        run: node scripts/content-abuse.mjs
      - name: Feed boundary abuse
        run: node scripts/feed-boundary-abuse.mjs
      - name: Number magnitude abuse
        run: node scripts/number-magnitude-abuse.mjs
      - name: Unit ambiguity abuse
        run: node scripts/unit-ambiguity-abuse.mjs
      - name: Clock-time number abuse
        run: node scripts/clock-time-number-abuse.mjs
      - name: Calendar-date number abuse
        run: node scripts/calendar-date-number-abuse.mjs
      - name: Timestamp poisoning abuse
        run: node scripts/timestamp-abuse.mjs
      - name: Template headline collision abuse
        run: node scripts/template-collision-abuse.mjs
      - name: IPv6 URL boundary abuse
        run: node scripts/ipv6-boundary-abuse.mjs
      - name: Outlet case inflation abuse
        run: node scripts/outlet-case-abuse.mjs
      - name: Placeholder outlet inflation abuse
        run: node scripts/placeholder-outlet-abuse.mjs
      - name: Source-link trust abuse
        run: node scripts/source-link-abuse.mjs
      - run: npm run build
      - name: Start app
        run: |
          npm run start > /tmp/maekrak-next.log 2>&1 &
          echo $! > /tmp/maekrak-next.pid
      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/maekrak-next.log
          exit 1
      - name: Adversarial E2E
        run: npm run test:e2e
      - name: Browser visual abuse
        run: npm run test:visual
      - name: Publish tested source-link hardening PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "seulkidesign-app"
          git config user.email "seulki.design@gmail.com"
          git add -A
          git commit -m "Harden trusted source labels against link-domain spoofing"
          BRANCH="redteam/source-link-trust-${GITHUB_RUN_ID}"
          git branch "$BRANCH"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Harden trusted source labels against link-domain spoofing" --body "Red-team fix: bind trusted outlet labels to official article domains while allowing Google News wrappers only for aggregated feeds. Full adversarial CI passed before publication."
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/maekrak-next.log || true
