      - name: Evidence lexical ambiguity abuse
        run: node scripts/evidence-lexical-ambiguity-abuse.mjs
      - name: Korean evidence lexical ambiguity abuse
        run: node scripts/evidence-korean-lexical-ambiguity-abuse.mjs
      - name: Timeline correction retention abuse
        run: node scripts/timeline-correction-abuse.mjs
      - name: Accuracy correction retention abuse
