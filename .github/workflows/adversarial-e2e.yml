name: adversarial-e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Adversarial content pipeline
        run: node scripts/content-abuse.mjs
      - run: npm run build
      - name: Start app
        run: |
          npm run start > /tmp/maekrak-next.log 2>&1 &
          echo $! > /tmp/maekrak-next.pid
      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/maekrak-next.log
          exit 1
      - name: Adversarial E2E
        run: npm run test:e2e
      - name: Browser visual abuse
        run: npm run test:visual
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/maekrak-next.log || true
