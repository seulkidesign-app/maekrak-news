        run: node scripts/priority-trust-slot-abuse.mjs
      - name: Unverified display laundering abuse
        run: node scripts/unverified-display-laundering-abuse.mjs
      - name: Calendar rollover abuse
        run: node scripts/calendar-rollover-abuse.mjs
      - name: Mobile unbroken source-text abuse
        run: node scripts/mobile-unbroken-text-abuse.mjs
      - name: Mobile safe-area overlap abuse
        run: node scripts/mobile-safe-area-abuse.mjs
      - name: World-flow unverified poisoning abuse
        run: node scripts/world-flow-unverified-poisoning-abuse.mjs
      - name: Korea impact poisoning abuse
        run: node scripts/korea-impact-poisoning-abuse.mjs
      - name: Location housing-flow false-positive abuse
        run: node scripts/location-housing-flow-abuse.mjs
