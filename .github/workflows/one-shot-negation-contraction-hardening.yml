name: one-shot-negation-contraction-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          const { auditEventAccuracy } = await import('./lib/accuracy.ts');
          const article = (title, source) => ({
            title, description: title, source, link: 'https://example.com/story',
            publishedAt: '2026-08-31T04:00:00Z', category: '정치', scope: 'world',
            sourceType: 'aggregated', sourceRole: source === 'Reuters' ? 'wire' : 'international',
          });
          const event = {
            id: 'negation-contraction-repro', title: 'Bill approval', category: '정치', scope: 'world', summary: '',
            publishedAt: '2026-08-31T04:00:00Z', dayStatus: 'today',
            articles: [article('Government approved the bill', 'Reuters'), article("Government hasn't approved the bill", 'BBC')],
            sourceCount: 2, importanceScore: 8, whySelected: [], briefWhy: 'politics', briefWatch: 'follow-up',
          };
          const audit = auditEventAccuracy(event);
          if (audit.negationDifference) throw new Error('negation contraction attack no longer reproduces');
          console.log('REPRODUCED: has not contraction bypasses negation disagreement detection');
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const accuracyPath = 'lib/accuracy.ts';
          let accuracy = readFileSync(accuracyPath, 'utf8');
          const oldToken = "didn['’]t|doesn['’]t|won['’]t|can['’]t|cannot";
          const newToken = "didn['’]t|doesn['’]t|won['’]t|can['’]t|(?:isn|aren|wasn|weren|hasn|haven|hadn|shouldn|wouldn|couldn|mustn|needn|ain)['’]t|cannot";
          if (!accuracy.includes(oldToken)) throw new Error('NEGATION contraction anchor not found');
          accuracy = accuracy.replace(oldToken, newToken);
          writeFileSync(accuracyPath, accuracy);

          const regression = `const failures = [];
          const passes = [];
          const { auditEventAccuracy } = await import("../lib/accuracy.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const article = (title, source) => ({
            title, description: title, source, link: "https://example.com/story",
            publishedAt: "2026-08-31T04:00:00Z", category: "정치", scope: "world",
            sourceType: "aggregated", sourceRole: source === "Reuters" ? "wire" : "international",
          });
          const event = (left, right) => ({
            id: "negation-contraction", title: left.title, category: "정치", scope: "world", summary: "",
            publishedAt: "2026-08-31T04:00:00Z", dayStatus: "today", articles: [left, right],
            sourceCount: 2, importanceScore: 8, whySelected: [], briefWhy: "politics", briefWatch: "follow-up",
          });
          const conflict = (negativeTitle) => auditEventAccuracy(event(
            article("Government approved the bill", "Reuters"),
            article(negativeTitle, "BBC"),
          )).negationDifference;
          check("hasn't is recognized as negation", conflict("Government hasn't approved the bill"));
          check("isn't is recognized as negation", conflict("Government isn't approving the bill"));
          check("wasn't is recognized as negation", conflict("Government wasn't approving the bill"));
          check("couldn't is recognized as negation", conflict("Government couldn't approve the bill"));
          check("shouldn't is recognized as negation", conflict("Government shouldn't approve the bill"));
          check("curly apostrophe contraction is recognized", conflict("Government hasn’t approved the bill"));
          const samePositive = auditEventAccuracy(event(
            article("Government approved the bill", "Reuters"),
            article("Government approves the bill", "BBC"),
          ));
          check("two positive reports do not create false negation conflict", !samePositive.negationDifference);
          console.log("Negation contraction abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/negation-contraction-abuse.mjs', regression);

          const ciPath = '.github/workflows/adversarial-e2e.yml';
          let ci = readFileSync(ciPath, 'utf8');
          const anchor = `      - name: Negation disagreement abuse\n        run: node scripts/negation-disagreement-abuse.mjs\n`;
          const step = `      - name: Negation contraction abuse\n        run: node scripts/negation-contraction-abuse.mjs\n`;
          if (!ci.includes('Negation contraction abuse')) {
            if (!ci.includes(anchor)) throw new Error('CI negation insertion anchor not found');
            ci = ci.replace(anchor, anchor + step);
          }
          writeFileSync(ciPath, ci);
          EOF

          node scripts/negation-contraction-abuse.mjs
          node scripts/negation-disagreement-abuse.mjs
          node scripts/number-label-negation-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build

          rm -f .github/workflows/one-shot-negation-contraction-hardening.yml
          git add -A
          git commit -m "Detect negation contractions in source disagreement checks"
          git push origin HEAD:main
