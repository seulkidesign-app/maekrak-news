name: one-shot-unverified-cluster-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          const { __test } = await import('./lib/news.ts');
          const make = (source, publishedAt, title) => ({
            title,
            description: title,
            source,
            link: 'https://example.com/story',
            publishedAt,
            category: '세계',
            scope: 'world',
            sourceType: 'aggregated',
            sourceRole: source === 'Reuters' ? 'wire' : source === 'BBC' ? 'international' : 'other',
          });
          const u = make('Unverified source', '2026-08-30T20:00:00Z', 'Iran sanctions talks resume in Oman Monday');
          const a = make('Reuters', '2026-08-30T10:00:00Z', 'Iran sanctions talks resume in Oman Tuesday');
          const b = make('BBC', '2026-08-30T00:00:00Z', 'Iran sanctions talks resume in Oman Wednesday');
          if (!__test.sameEvent(u, a) || !__test.sameEvent(a, b) || __test.sameEvent(u, b)) throw new Error('attack relation did not reproduce');
          const clusters = [];
          for (const item of [u, a, b]) {
            const match = clusters.find((cluster) => cluster.length && cluster.every((member) => __test.sameEvent(member, item)));
            if (match) match.push(item); else clusters.push([item]);
          }
          const trustedTogether = clusters.some((cluster) => cluster.some((x) => x.source === 'Reuters') && cluster.some((x) => x.source === 'BBC'));
          if (trustedTogether) throw new Error('current clustering unexpectedly resisted poisoning');
          console.log('REPRODUCED: unverified article splits two verified reports of the same event');
          EOF

          node scripts/apply-timezone-hardening.mjs

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          let news = readFileSync('lib/news.ts', 'utf8');
          const oldBlock = `function clusterNewsItems(items: NewsItem[]) {
            const clusters: NewsItem[][] = [];
            for (const item of items) {
              const match = clusters.find((cluster) => cluster.length > 0 && cluster.every((member) => sameEvent(member, item)));
              if (match) match.push(item);
              else clusters.push([item]);
            }
            return clusters;
          }`;
          const newBlock = `function clusterNewsItems(items: NewsItem[]) {
            const verifiedItems = verifiedSourceArticles(items);
            const unverifiedItems = items.filter((item) => canonicalSourceName(item.source) === "Unverified source");
            const verifiedClusters: NewsItem[][] = [];

            for (const item of verifiedItems) {
              const match = verifiedClusters.find((cluster) => cluster.length > 0 && cluster.every((member) => sameEvent(member, item)));
              if (match) match.push(item);
              else verifiedClusters.push([item]);
            }

            const unverifiedOnlyClusters: NewsItem[][] = [];
            for (const item of unverifiedItems) {
              const verifiedMatch = verifiedClusters.find((cluster) => {
                const trustedMembers = verifiedSourceArticles(cluster);
                return trustedMembers.length > 0 && trustedMembers.every((member) => sameEvent(member, item));
              });
              if (verifiedMatch) {
                verifiedMatch.push(item);
                continue;
              }

              const unverifiedMatch = unverifiedOnlyClusters.find((cluster) => cluster.length > 0 && cluster.every((member) => sameEvent(member, item)));
              if (unverifiedMatch) unverifiedMatch.push(item);
              else unverifiedOnlyClusters.push([item]);
            }

            return [...verifiedClusters, ...unverifiedOnlyClusters];
          }`;
          if (!news.includes(oldBlock)) throw new Error('clusterNewsItems patch anchor not found');
          news = news.replace(oldBlock, newBlock);
          if (!news.includes('  clusterNewsItems,')) {
            news = news.replace('  sameEvent,\n  stableEventId,', '  sameEvent,\n  clusterNewsItems,\n  stableEventId,');
          }
          writeFileSync('lib/news.ts', news);

          const regression = `const failures = [];
          const passes = [];
          const { __test } = await import("../lib/news.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const make = (source, publishedAt, title) => ({
            title, description: title, source, link: "https://example.com/story", publishedAt,
            category: "세계", scope: "world", sourceType: "aggregated",
            sourceRole: source === "Reuters" ? "wire" : source === "BBC" ? "international" : "other",
          });
          const poison = make("Unverified source", "2026-08-30T20:00:00Z", "Iran sanctions talks resume in Oman Monday");
          const reuters = make("Reuters", "2026-08-30T10:00:00Z", "Iran sanctions talks resume in Oman Tuesday");
          const bbc = make("BBC", "2026-08-30T00:00:00Z", "Iran sanctions talks resume in Oman Wednesday");
          check("poison matches the newer verified report", __test.sameEvent(poison, reuters));
          check("verified reports are the same event", __test.sameEvent(reuters, bbc));
          check("poison does not match the older verified report", !__test.sameEvent(poison, bbc));
          const clusters = __test.clusterNewsItems([poison, reuters, bbc]);
          const trustedCluster = clusters.find((cluster) => cluster.some((x) => x.source === "Reuters") && cluster.some((x) => x.source === "BBC"));
          check("unverified poison cannot split verified reports", Boolean(trustedCluster));
          check("poison is not allowed to contaminate a verified cluster it does not fully match", Boolean(trustedCluster) && !trustedCluster.some((x) => x.source === "Unverified source"));
          check("poison remains visible in a separate cluster", clusters.some((cluster) => cluster.some((x) => x.source === "Unverified source")));
          const onlyUnknown = __test.clusterNewsItems([
            make("Unverified source", "2026-08-30T10:00:00Z", "Storm closes airport after flooding"),
            make("Unverified source", "2026-08-30T09:00:00Z", "Storm closes airport after flooding"),
          ]);
          check("all-unverified reporting still clusters rather than disappearing", onlyUnknown.length === 1 && onlyUnknown[0].length === 2);
          console.log("Unverified cluster poisoning abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/unverified-cluster-poisoning-abuse.mjs', regression);

          let ci = readFileSync('.github/workflows/adversarial-e2e.yml', 'utf8');
          const anchor = `      - name: Cluster bridge poisoning abuse\n        run: node scripts/cluster-bridge-abuse.mjs\n`;
          const step = `      - name: Unverified cluster poisoning abuse\n        run: node scripts/unverified-cluster-poisoning-abuse.mjs\n`;
          if (!ci.includes('Unverified cluster poisoning abuse')) {
            if (!ci.includes(anchor)) throw new Error('CI cluster insertion anchor not found');
            ci = ci.replace(anchor, anchor + step);
          }
          writeFileSync('.github/workflows/adversarial-e2e.yml', ci);
          EOF

          node scripts/unverified-cluster-poisoning-abuse.mjs
          node scripts/timezone-less-published-at-abuse.mjs
          node scripts/ambiguous-timezone-abbreviation-abuse.mjs
          node scripts/cluster-bridge-abuse.mjs
          node scripts/content-abuse.mjs
          node scripts/calendar-rollover-abuse.mjs
          node scripts/timestamp-abuse.mjs
          npm run build

          rm -f .github/workflows/one-shot-unverified-cluster-hardening.yml
          git add -A
          git commit -m "Prevent unverified articles from splitting trusted event clusters"
          git push origin HEAD:main
