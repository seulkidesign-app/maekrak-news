name: apply-loopback-dns-fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/loopback-dns-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loopback DNS aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()
          old = 'if (host === "localhost" || host.endsWith(".localhost") || host.endsWith(".local")) return true;'
          new = 'if (host === "localhost" || host.endsWith(".localhost") || host.endsWith(".local") || host === "localtest.me" || host.endsWith(".localtest.me") || host === "lvh.me" || host.endsWith(".lvh.me")) return true;'
          if old not in text:
              raise SystemExit('target expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/news.ts
          git commit -m "fix: block loopback DNS aliases"
          git push
