name: one-shot-unverified-event-id-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Patch and verify event identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --input-type=module -e 'const {__test}=await import("./lib/news.ts"); const make=(source,time,title)=>({title,description:title,source,link:"https://example.com/story",publishedAt:time,category:"세계",scope:"world",sourceType:"aggregated",sourceRole:source==="Reuters"?"wire":"other"}); const v=make("Reuters","2026-08-30T10:00:00Z","Iran sanctions talks resume in Oman Tuesday"); const u=make("Unverified source","2026-08-30T09:00:00Z","Iran sanctions talks resume in Oman Monday"); if(!__test.sameEvent(v,u)) throw new Error("attack articles do not cluster"); if(__test.stableEventId([v])===__test.stableEventId([v,u])) throw new Error("attack no longer reproduces"); console.log("REPRODUCED unverified event ID churn");'
          python3 -c 'from pathlib import Path; p=Path("lib/news.ts"); s=p.read_text(); old="  const earliest = [...articles].sort((a, b) => new Date(a.publishedAt).getTime() - new Date(b.publishedAt).getTime())[0];\n  const anchor = earliest?.title ?? articles[0]?.title ?? \"event\";"; new="  const verified = verifiedSourceArticles(articles);\n  const identityPool = verified.length ? verified : articles;\n  const earliest = [...identityPool].sort((a, b) => new Date(a.publishedAt).getTime() - new Date(b.publishedAt).getTime())[0];\n  const anchor = earliest?.title ?? identityPool[0]?.title ?? \"event\";"; assert old in s, "stableEventId patch anchor not found"; p.write_text(s.replace(old,new))'
          node scripts/unverified-event-id-churn-abuse.mjs
          node scripts/event-id-collision-abuse.mjs
          node scripts/unverified-cluster-poisoning-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build
          rm -f .github/workflows/one-shot-unverified-event-id-hardening.yml
          git add -A
          git commit -m "Exclude unverified backfills from trusted event identity"
          git push origin HEAD:main
