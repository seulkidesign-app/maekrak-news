name: one-shot-unverified-event-id-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          const { __test } = await import('./lib/news.ts');
          const make = (source, time, title) => ({
            title, description: title, source, link: 'https://example.com/story', publishedAt: time,
            category: '세계', scope: 'world', sourceType: 'aggregated',
            sourceRole: source === 'Reuters' ? 'wire' : 'other',
          });
          const verified = make('Reuters', '2026-08-30T10:00:00Z', 'Iran sanctions talks resume in Oman Tuesday');
          const poison = make('Unverified source', '2026-08-30T09:00:00Z', 'Iran sanctions talks resume in Oman Monday');
          if (!__test.sameEvent(verified, poison)) throw new Error('attack articles do not cluster');
          const before = __test.stableEventId([verified]);
          const after = __test.stableEventId([verified, poison]);
          if (before === after) throw new Error('event ID churn attack no longer reproduces');
          console.log('REPRODUCED event ID churn: ' + before + ' -> ' + after);
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          let news = readFileSync('lib/news.ts', 'utf8');
          const oldLines = '  const earliest = [...articles].sort((a, b) => new Date(a.publishedAt).getTime() - new Date(b.publishedAt).getTime())[0];\n  const anchor = earliest?.title ?? articles[0]?.title ?? "event";';
          const newLines = '  const verified = verifiedSourceArticles(articles);\n  const identityPool = verified.length ? verified : articles;\n  const earliest = [...identityPool].sort((a, b) => new Date(a.publishedAt).getTime() - new Date(b.publishedAt).getTime())[0];\n  const anchor = earliest?.title ?? identityPool[0]?.title ?? "event";';
          if (!news.includes(oldLines)) throw new Error('stableEventId patch anchor not found');
          news = news.replace(oldLines, newLines);
          writeFileSync('lib/news.ts', news);

          const regression = `const failures = [];
const passes = [];
const { __test } = await import("../lib/news.ts");
const check = (name, condition) => condition ? passes.push(name) : failures.push(name);
const make = (source, time, title) => ({
  title, description: title, source, link: "https://example.com/story", publishedAt: time,
  category: "세계", scope: "world", sourceType: "aggregated",
  sourceRole: source === "Reuters" ? "wire" : source === "BBC" ? "international" : "other",
});
const reuters = make("Reuters", "2026-08-30T10:00:00Z", "Iran sanctions talks resume in Oman Tuesday");
const poison = make("Unverified source", "2026-08-30T09:00:00Z", "Iran sanctions talks resume in Oman Monday");
check("attack article still clusters with verified article", __test.sameEvent(reuters, poison));
check("unverified backfill cannot change verified event ID", __test.stableEventId([reuters]) === __test.stableEventId([reuters, poison]));
const bbc = make("BBC", "2026-08-30T08:00:00Z", "Iran sanctions talks resume in Oman Wednesday");
check("earlier verified reporting can still define the event identity", __test.stableEventId([reuters, poison, bbc]) === __test.stableEventId([reuters, bbc]));
const unknownA = make("Unverified source", "2026-08-30T09:00:00Z", "Storm closes airport after flooding Monday");
const unknownB = make("Unverified source", "2026-08-30T10:00:00Z", "Storm closes airport after flooding Tuesday");
check("all-unverified events still receive deterministic IDs", __test.stableEventId([unknownA, unknownB]) === __test.stableEventId([unknownB, unknownA]));
console.log("Unverified event ID churn abuse: " + passes.length + " passed / " + failures.length + " failed");
passes.forEach((name) => console.log("PASS  " + name));
failures.forEach((name) => console.error("FAIL  " + name));
if (failures.length) process.exit(1);
`;
          writeFileSync('scripts/unverified-event-id-churn-abuse.mjs', regression);

          let ci = readFileSync('.github/workflows/adversarial-e2e.yml', 'utf8');
          const anchor = '      - name: Event ID collision abuse\n        run: node scripts/event-id-collision-abuse.mjs\n';
          const step = '      - name: Unverified event ID churn abuse\n        run: node scripts/unverified-event-id-churn-abuse.mjs\n';
          if (!ci.includes('Unverified event ID churn abuse')) {
            if (!ci.includes(anchor)) throw new Error('CI event ID anchor not found');
            ci = ci.replace(anchor, anchor + step);
          }
          writeFileSync('.github/workflows/adversarial-e2e.yml', ci);
          EOF

          node scripts/unverified-event-id-churn-abuse.mjs
          node scripts/event-id-collision-abuse.mjs
          node scripts/unverified-cluster-poisoning-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build

          rm -f .github/workflows/one-shot-unverified-event-id-hardening.yml
          git add -A
          git commit -m "Exclude unverified backfills from trusted event identity"
          git push origin HEAD:main
