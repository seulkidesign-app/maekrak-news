name: one-shot-priority-trust-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const news = readFileSync('lib/news.ts', 'utf8');
          const page = readFileSync('app/page.tsx', 'utf8');
          const selectorVulnerable = news.includes('const selected = events.slice(0, limit);');
          const fallbackVulnerable = page.includes('for (const event of readyEvents)') && !page.includes('const priorityCandidates = readyEvents.filter((event) => event.sourceCount > 0);');
          if (!selectorVulnerable || !fallbackVulnerable) throw new Error('priority-slot poisoning no longer reproduces');
          console.log('REPRODUCED: unverified-only events can occupy key-event priority slots');
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';

          let news = readFileSync('lib/news.ts', 'utf8');
          const oldSelector = `function selectPriorityEventIds(events: NewsEvent[], limit = 5) {
            const selected = events.slice(0, limit);
            if (!selected.length) return [];

            const ensureScope = (scope: NewsScope) => {
              if (selected.some((event) => event.scope === scope)) return;
              const candidate = events.find((event) => event.scope === scope && !selected.some((item) => item.id === event.id));`;
          const newSelector = `function selectPriorityEventIds(events: NewsEvent[], limit = 5) {
            const eligibleEvents = events.filter((event) => event.sourceCount > 0);
            const selected = eligibleEvents.slice(0, limit);
            if (!selected.length) return [];

            const ensureScope = (scope: NewsScope) => {
              if (selected.some((event) => event.scope === scope)) return;
              const candidate = eligibleEvents.find((event) => event.scope === scope && !selected.some((item) => item.id === event.id));`;
          if (!news.includes(oldSelector)) throw new Error('priority selector patch anchor not found');
          news = news.replace(oldSelector, newSelector);
          if (!news.includes('  selectPriorityEventIds,')) {
            const exportAnchor = '  categoryCoverageFor,\n';
            if (!news.includes(exportAnchor)) throw new Error('__test export anchor not found');
            news = news.replace(exportAnchor, exportAnchor + '  selectPriorityEventIds,\n');
          }
          writeFileSync('lib/news.ts', news);

          let page = readFileSync('app/page.tsx', 'utf8');
          const oldPage = `  const readyEvents = events;
            const languagePending = lang === "ko" ? events.filter((event) => !hasHeadlineForLanguage(event, "ko")) : [];
            const readyById = new Map(readyEvents.map((event) => [event.id, event]));
            const priorityEvents: NewsEvent[] = [];

            for (const id of briefing.priorityEventIds) {
              const event = readyById.get(id);
              if (event && priorityEvents.length < 5) priorityEvents.push(event);
            }
            for (const event of readyEvents) {
              if (priorityEvents.length >= 5) break;
              if (!priorityEvents.some((item) => item.id === event.id)) priorityEvents.push(event);
            }`;
          const newPage = `  const readyEvents = events;
            const languagePending = lang === "ko" ? events.filter((event) => !hasHeadlineForLanguage(event, "ko")) : [];
            const priorityCandidates = readyEvents.filter((event) => event.sourceCount > 0);
            const readyById = new Map(priorityCandidates.map((event) => [event.id, event]));
            const priorityEvents: NewsEvent[] = [];

            for (const id of briefing.priorityEventIds) {
              const event = readyById.get(id);
              if (event && priorityEvents.length < 5) priorityEvents.push(event);
            }
            for (const event of priorityCandidates) {
              if (priorityEvents.length >= 5) break;
              if (!priorityEvents.some((item) => item.id === event.id)) priorityEvents.push(event);
            }`;
          if (!page.includes(oldPage)) throw new Error('page priority fallback patch anchor not found');
          page = page.replace(oldPage, newPage);
          writeFileSync('app/page.tsx', page);

          const regression = `import { readFile } from "node:fs/promises";
          const failures = [];
          const passes = [];
          const { __test } = await import("../lib/news.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const event = (id, sourceCount, importanceScore, scope = "world") => ({
            id, title: id, category: "세계", scope, summary: id,
            publishedAt: "2026-08-31T00:00:00Z", dayStatus: "today", articles: [], sourceCount,
            importanceScore, whySelected: [], briefWhy: "broad-impact", briefWatch: "single-source",
          });
          const poisoned = [
            event("unknown-1", 0, 99), event("unknown-2", 0, 98), event("unknown-3", 0, 97),
            event("unknown-4", 0, 96), event("unknown-5", 0, 95),
            event("verified-world", 1, 6, "world"), event("verified-domestic", 1, 5, "domestic"), event("verified-2", 2, 4, "world"),
          ];
          const selected = __test.selectPriorityEventIds(poisoned, 5);
          check("unverified-only events cannot occupy priority IDs", selected.every((id) => !id.startsWith("unknown-")));
          check("verified events survive priority-slot flooding", selected.includes("verified-world") && selected.includes("verified-domestic") && selected.includes("verified-2"));
          check("selector returns only available verified candidates", selected.length === 3);
          check("all-unverified input produces no promoted key events", __test.selectPriorityEventIds(poisoned.slice(0, 5), 5).length === 0);
          const page = await readFile(new URL("../app/page.tsx", import.meta.url), "utf8");
          check("page fallback filters key-event candidates by verified source count", page.includes('const priorityCandidates = readyEvents.filter((event) => event.sourceCount > 0);'));
          check("page fallback no longer refills key slots from all events", page.includes('for (const event of priorityCandidates)') && !page.includes('for (const event of readyEvents)'));
          console.log("Priority trust-slot poisoning abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/priority-trust-slot-abuse.mjs', regression);
          EOF

          node scripts/priority-trust-slot-abuse.mjs
          node scripts/coverage-trust-poisoning-abuse.mjs
          node scripts/unverified-trust-signal-laundering-abuse.mjs
          node scripts/unverified-cluster-poisoning-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build

          git restore .next 2>/dev/null || true
          git clean -fd .next >/dev/null 2>&1 || true
          git add lib/news.ts app/page.tsx scripts/priority-trust-slot-abuse.mjs
          git commit -m "Exclude unverified-only events from key-news priority slots"
          git push origin HEAD:main
