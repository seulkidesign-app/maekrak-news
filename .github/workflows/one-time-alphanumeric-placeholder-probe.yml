name: one-time-alphanumeric-placeholder-probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Alphanumeric placeholder suffix abuse
        run: node scripts/alphanumeric-placeholder-suffix-abuse.mjs
