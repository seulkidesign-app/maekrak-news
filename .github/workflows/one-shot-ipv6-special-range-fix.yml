name: ipv6-special-range-fix

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()
          old = '  if (host === "::" || host === "::1" || /^(?:fc|fd)[0-9a-f]{2}:/i.test(host) || /^fe[89ab][0-9a-f]:/i.test(host)) return true;'
          new = '  if (host === "::" || host === "::1" || /^(?:fc|fd)[0-9a-f]{2}:/i.test(host) || /^fe[89abcdef][0-9a-f]:/i.test(host) || /^ff[0-9a-f]{2}:/i.test(host)) return true;'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          node scripts/ipv6-boundary-abuse.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- lib/news.ts; then exit 0; fi
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add lib/news.ts
          git commit -m "fix: reject IPv6 special-use ranges"
          git push origin HEAD:main
