name: integrity-retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrity-retry.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          p = Path("lib/news.ts")
          s = p.read_text()

          if 'import { createHash } from "node:crypto";' not in s:
              marker = 'import { XMLParser } from "fast-xml-parser";\n'
              assert marker in s
              s = s.replace(marker, 'import { createHash } from "node:crypto";\n' + marker, 1)

          old_hash = dedent('''\
          function stableHash(value: string) {
            let hash = 2166136261;
            for (let index = 0; index < value.length; index += 1) {
              hash ^= value.charCodeAt(index);
              hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(36);
          }''')
          new_hash = dedent('''\
          function stableHash(value: string) {
            return createHash("sha256").update(value, "utf8").digest("hex").slice(0, 24);
          }''')
          if old_hash in s:
              s = s.replace(old_hash, new_hash, 1)
          assert 'createHash("sha256")' in s

          majority = dedent('''\
          function majority<T extends string>(values: T[], fallback: T): T {
            const counts = new Map<T, number>();
            values.forEach((value) => counts.set(value, (counts.get(value) ?? 0) + 1));
            return [...counts.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] ?? fallback;
          }
          ''')
          balanced = dedent('''\
          function sourceBalancedMajority<T extends string>(articles: NewsItem[], select: (article: NewsItem) => T, fallback: T): T {
            const bySource = new Map<string, T[]>();
            for (const article of articles) {
              const source = canonicalSourceName(article.source).toLowerCase();
              const values = bySource.get(source) ?? [];
              values.push(select(article));
              bySource.set(source, values);
            }
            const sourceVotes = [...bySource.values()].map((values) => majority(values, fallback));
            const counts = new Map<T, number>();
            sourceVotes.forEach((value) => counts.set(value, (counts.get(value) ?? 0) + 1));
            return [...counts.entries()].sort((a, b) => {
              const delta = b[1] - a[1];
              if (delta) return delta;
              if (a[0] === fallback) return -1;
              if (b[0] === fallback) return 1;
              return 0;
            })[0]?.[0] ?? fallback;
          }
          ''')
          if 'function sourceBalancedMajority' not in s:
              assert majority in s
              s = s.replace(majority, majority + balanced, 1)
          s = s.replace('const category = majority(sorted.map((article) => article.category), primary.category);', 'const category = sourceBalancedMajority(sorted, (article) => article.category, primary.category);')
          s = s.replace('const scope = majority(sorted.map((article) => article.scope), primary.scope);', 'const scope = sourceBalancedMajority(sorted, (article) => article.scope, primary.scope);')

          helper = dedent('''\
          function hasValidExplicitCalendarDate(raw: string) {
            const match = raw.match(/^(\\d{4})-(\\d{2})-(\\d{2})(?:T|\\s|$)/);
            if (!match) return true;
            const year = Number(match[1]);
            const month = Number(match[2]);
            const day = Number(match[3]);
            if (month < 1 || month > 12 || day < 1) return false;
            return day <= new Date(Date.UTC(year, month, 0)).getUTCDate();
          }

          ''')
          pub = 'function safePublishedAt(value: unknown, now = Date.now()) {\n'
          if 'function hasValidExplicitCalendarDate' not in s:
              assert pub in s
              s = s.replace(pub, helper + pub, 1)
          s = s.replace('  if (!raw) return "";\n  const parsed = new Date(raw);', '  if (!raw || !hasValidExplicitCalendarDate(raw)) return "";\n  const parsed = new Date(raw);', 1)

          export_tail = '  hasProperNameConflict,\n  sameEvent,\n};'
          if export_tail in s:
              s = s.replace(export_tail, '  hasProperNameConflict,\n  sameEvent,\n  stableEventId,\n  sourceBalancedMajority,\n};', 1)
          assert '  stableEventId,\n' in s and '  sourceBalancedMajority,\n' in s
          p.write_text(s)

          Path("scripts/event-id-collision-abuse.mjs").write_text(dedent(r'''
          const { __test } = await import("../lib/news.ts");
          const article = (title) => ({ title, description:title, source:"Example News", link:"https://example.com/story", publishedAt:"2026-08-28T00:00:00.000Z", category:"세계", scope:"world", sourceType:"direct", sourceRole:"other" });
          const a = __test.stableEventId([article("clkabuym fverifen")]);
          const b = __test.stableEventId([article("nkhbrcyr oltwxqyh")]);
          if (a === b || !/^evt_[0-9a-f]{24}$/.test(a) || __test.stableEventId([article("clkabuym fverifen")]) !== a) process.exit(1);
          console.log("Event ID collision abuse: 3 passed / 0 failed");
          ''').lstrip())

          Path("scripts/source-flood-abuse.mjs").write_text(dedent(r'''
          const { __test } = await import("../lib/news.ts");
          const article = (source, category, scope="world") => ({ title:`${source} update`, description:"", source, link:"https://example.com/story", publishedAt:"2026-08-28T00:00:00.000Z", category, scope, sourceType:"direct", sourceRole:"other" });
          const cats = [...Array.from({length:8},()=>article("Flood News","경제")), article("Outlet B","정치"), article("Outlet C","정치")];
          const scopes = [...Array.from({length:9},()=>article("Flood News","세계","domestic")), article("Outlet B","세계","world"), article("Outlet C","세계","world")];
          if (__test.sourceBalancedMajority(cats,x=>x.category,"세계") !== "정치") process.exit(1);
          if (__test.sourceBalancedMajority(scopes,x=>x.scope,"world") !== "world") process.exit(1);
          console.log("Source flood abuse: 2 passed / 0 failed");
          ''').lstrip())

          Path("scripts/calendar-rollover-abuse.mjs").write_text(dedent(r'''
          const { __test } = await import("../lib/news.ts");
          const ok = [
            __test.safePublishedAt("2026-02-30T10:00:00Z", Date.parse("2026-03-10T00:00:00Z")) === "",
            __test.safePublishedAt("2025-02-29T10:00:00Z", Date.parse("2025-03-10T00:00:00Z")) === "",
            __test.safePublishedAt("2024-02-29T10:00:00Z", Date.parse("2024-03-10T00:00:00Z")) === "2024-02-29T10:00:00.000Z",
            __test.safePublishedAt("Fri, 28 Aug 2026 10:00:00 GMT", Date.parse("2026-08-28T12:00:00Z")) === "2026-08-28T10:00:00.000Z",
          ];
          if (!ok.every(Boolean)) process.exit(1);
          console.log("Calendar rollover abuse: 4 passed / 0 failed");
          ''').lstrip())

          ci = Path(".github/workflows/adversarial-e2e.yml")
          c = ci.read_text()
          marker = "      - name: Source-link trust abuse\n        run: node scripts/source-link-abuse.mjs\n"
          extra = ""
          for name, script in [("Event ID collision abuse","event-id-collision-abuse.mjs"),("Source flood abuse","source-flood-abuse.mjs"),("Calendar rollover abuse","calendar-rollover-abuse.mjs")]:
              if name not in c:
                  extra += f"      - name: {name}\n        run: node scripts/{script}\n"
          if extra:
              assert marker in c
              c = c.replace(marker, marker + extra, 1)
          ci.write_text(c)

          for temp in [Path(".github/workflows/event-id-collision-fix.yml"), Path(".github/workflows/integrity-retry.yml")]:
              if temp.exists(): temp.unlink()

      - run: npm install --no-audit --no-fund
      - run: node scripts/event-id-collision-abuse.mjs
      - run: node scripts/source-flood-abuse.mjs
      - run: node scripts/calendar-rollover-abuse.mjs
      - run: node scripts/content-abuse.mjs
      - run: npm run build
      - name: Commit verified source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden event integrity and publication dates"
          git push origin HEAD:main
