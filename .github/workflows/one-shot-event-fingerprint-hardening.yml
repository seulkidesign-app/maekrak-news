name: one-shot-event-fingerprint-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          const { __test } = await import('./lib/news.ts');
          const make = (title) => ({
            title, description: title, source: 'Reuters', link: 'https://reuters.com/story',
            publishedAt: '2026-08-30T10:00:00Z', category: '경제', scope: 'world',
            sourceType: 'aggregated', sourceRole: 'wire',
          });
          const a = make('Company approves budget changes across banking climate energy finance growth health industry jobs labor Zeta');
          const b = make('Company approves budget changes across banking climate energy finance growth health industry jobs labor Zulu');
          if (__test.sameEvent(a, b)) throw new Error('attack titles unexpectedly cluster as one event');
          const left = __test.stableEventId([a]);
          const right = __test.stableEventId([b]);
          if (left !== right) throw new Error('fingerprint truncation collision did not reproduce');
          console.log('REPRODUCED event fingerprint truncation collision:', left);
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          let news = readFileSync('lib/news.ts', 'utf8');
          const oldLine = '  const anchorTokens = [...tokens(anchor)].sort().slice(0, 12);';
          const newLine = '  const anchorTokens = [...tokens(anchor)].sort();';
          if (!news.includes(oldLine)) throw new Error('stableEventId token truncation anchor not found');
          news = news.replace(oldLine, newLine);
          writeFileSync('lib/news.ts', news);

          const regression = `const failures = [];
          const passes = [];
          const { __test } = await import("../lib/news.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const make = (title) => ({
            title, description: title, source: "Reuters", link: "https://reuters.com/story",
            publishedAt: "2026-08-30T10:00:00Z", category: "경제", scope: "world",
            sourceType: "aggregated", sourceRole: "wire",
          });
          const zeta = make("Company approves budget changes across banking climate energy finance growth health industry jobs labor Zeta");
          const zulu = make("Company approves budget changes across banking climate energy finance growth health industry jobs labor Zulu");
          check("distinct proper-name stories are not clustered", !__test.sameEvent(zeta, zulu));
          check("distinct stories no longer share an event id", __test.stableEventId([zeta]) !== __test.stableEventId([zulu]));
          const reorderA = make("Company approves budget changes across banking climate energy finance growth health industry jobs labor Zeta");
          const reorderB = make("Company labor jobs industry health growth finance energy climate banking across changes budget approves Zeta");
          check("token-order variation remains deterministic", __test.stableEventId([reorderA]) === __test.stableEventId([reorderB]));
          console.log("Event fingerprint truncation abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/event-fingerprint-truncation-abuse.mjs', regression);

          let ci = readFileSync('.github/workflows/adversarial-e2e.yml', 'utf8');
          const anchor = `      - name: Event ID collision abuse\n        run: node scripts/event-id-collision-abuse.mjs\n`;
          const step = `      - name: Event fingerprint truncation abuse\n        run: node scripts/event-fingerprint-truncation-abuse.mjs\n`;
          if (!ci.includes('Event fingerprint truncation abuse')) {
            if (!ci.includes(anchor)) throw new Error('CI event ID insertion anchor not found');
            ci = ci.replace(anchor, anchor + step);
          }
          writeFileSync('.github/workflows/adversarial-e2e.yml', ci);
          EOF

          node scripts/event-fingerprint-truncation-abuse.mjs
          node scripts/event-id-collision-abuse.mjs
          node scripts/cluster-bridge-abuse.mjs
          node scripts/unverified-cluster-poisoning-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build

          rm -f .github/workflows/one-shot-event-fingerprint-hardening.yml
          git add -A
          git commit -m "Prevent truncated event fingerprint collisions"
          git push origin HEAD:main
