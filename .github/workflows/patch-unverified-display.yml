name: patch-unverified-display

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-unverified-display.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch verified display candidate pool
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()
          old = '''export function getDisplayArticle(event: NewsEvent, lang: "ko" | "en") {
            const wantsKorean = lang === "ko";
            const scored = event.articles.map((article) => {'''
          new = '''export function getDisplayArticle(event: NewsEvent, lang: "ko" | "en") {
            const wantsKorean = lang === "ko";
            const verified = verifiedSourceArticles(event.articles);
            const candidates = verified.length ? verified : event.articles;
            const scored = candidates.map((article) => {'''
          if old not in text:
              raise SystemExit('target block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm install --no-audit --no-fund
      - name: Verify new regression
        run: node scripts/unverified-display-laundering-abuse.mjs
      - name: Verify production build
        run: npm run build
      - name: Commit verified patch and remove one-shot workflow
        run: |
          git config user.name "seulkidesign-app"
          git config user.email "seulki.design@gmail.com"
          git add lib/news.ts
          git rm .github/workflows/patch-unverified-display.yml
          git commit -m "Block unverified articles from representative display"
          git push origin HEAD:main
