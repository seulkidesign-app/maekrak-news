name: one-shot-shared-proper-name-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce shared proper-name template collision
        run: |
          node --input-type=module <<'EOF'
          const { __test } = await import('./lib/news.ts');
          const article = (title, source) => ({
            title, description: title, source, link: 'https://example.com/story',
            publishedAt: '2026-08-30T12:00:00Z', category: '세계', scope: 'world',
            sourceType: 'aggregated', sourceRole: source === 'Reuters' ? 'wire' : 'international',
          });
          const acme = article('Acme recalls phones following battery defect as nationwide consumer safety investigation expands after FDA warning', 'Reuters');
          const globex = article('Globex recalls phones following battery defect as nationwide consumer safety investigation expands after FDA warning', 'BBC');
          if (!__test.sameEvent(acme, globex)) throw new Error('attack did not reproduce');
          if (__test.hasProperNameConflict(acme.title, globex.title)) throw new Error('current conflict detector unexpectedly caught attack');
          console.log('REPRODUCED shared proper-name template collision');
          EOF
      - name: Patch proper-name conflict logic and add regression
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          let news = readFileSync('lib/news.ts', 'utf8');
          const oldBlock = `function hasProperNameConflict(a: string, b: string) {
            const left = properNameTokens(a);
            const right = properNameTokens(b);
            if (!left.size || !right.size) return false;
            for (const value of left) if (right.has(value)) return false;
            return true;
          }`;
          const newBlock = `function hasProperNameConflict(a: string, b: string) {
            const left = properNameTokens(a);
            const right = properNameTokens(b);
            if (!left.size || !right.size) return false;
            const leftOnly = [...left].filter((value) => !right.has(value));
            const rightOnly = [...right].filter((value) => !left.has(value));
            return leftOnly.length > 0 && rightOnly.length > 0;
          }`;
          if (!news.includes(oldBlock)) throw new Error('proper-name patch anchor not found');
          news = news.replace(oldBlock, newBlock);
          writeFileSync('lib/news.ts', news);

          const test = `const failures = [];
          const passes = [];
          const { __test } = await import("../lib/news.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          function article(title, source) { return { title, description: title, source, link: "https://example.com/story", publishedAt: "2026-08-30T12:00:00Z", category: "세계", scope: "world", sourceType: "aggregated", sourceRole: source === "Reuters" ? "wire" : "international" }; }
          const acme = article("Acme recalls phones following battery defect as nationwide consumer safety investigation expands after FDA warning", "Reuters");
          const globex = article("Globex recalls phones following battery defect as nationwide consumer safety investigation expands after FDA warning", "BBC");
          check("shared FDA context does not hide conflicting company names", __test.hasProperNameConflict(acme.title, globex.title));
          check("different companies sharing FDA are not merged", !__test.sameEvent(acme, globex));
          const sameA = article("Acme recalls phones following battery defect after FDA warning", "Reuters");
          const sameB = article("Acme recalls phones following battery defect following FDA warning", "BBC");
          check("same company sharing FDA still clusters", __test.sameEvent(sameA, sameB));
          const extraContextA = article("Acme recalls phones after FDA warning", "Reuters");
          const extraContextB = article("Acme recalls phones after FDA warning in California", "BBC");
          check("one-sided extra proper context does not force a conflict", !__test.hasProperNameConflict(extraContextA.title, extraContextB.title));
          console.log("Shared proper-name template collision abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/shared-proper-name-template-collision-abuse.mjs', test);

          let ci = readFileSync('.github/workflows/adversarial-e2e.yml', 'utf8');
          const anchor = `      - name: Template headline collision abuse\n        run: node scripts/template-collision-abuse.mjs\n`;
          const step = `      - name: Shared proper-name template collision abuse\n        run: node scripts/shared-proper-name-template-collision-abuse.mjs\n`;
          if (!ci.includes('Shared proper-name template collision abuse')) {
            if (!ci.includes(anchor)) throw new Error('CI insertion anchor not found');
            ci = ci.replace(anchor, anchor + step);
          }
          writeFileSync('.github/workflows/adversarial-e2e.yml', ci);
          EOF
      - name: Run focused regressions
        run: |
          node scripts/shared-proper-name-template-collision-abuse.mjs
          node scripts/template-collision-abuse.mjs
          node scripts/cluster-bridge-abuse.mjs
          node scripts/korea-entity-boundary-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build
      - name: Commit hardened code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-shared-proper-name-hardening.yml
          git add -A
          git commit -m "Harden shared proper-name template collisions"
          git push origin HEAD:main
