name: one-shot-feed-window-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch feed selection and regression
        run: python scripts/one-shot-feed-window-patch.py
      - name: Remove temporary patch files
        run: rm .github/workflows/one-shot-feed-window-hardening.yml scripts/one-shot-feed-window-patch.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden RSS feed window starvation"
          git push origin HEAD:main
