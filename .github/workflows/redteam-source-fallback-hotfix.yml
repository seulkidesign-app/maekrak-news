name: redteam-source-fallback-hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/redteam-source-fallback-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch aggregated source fallback and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          news_path = Path("lib/news.ts")
          news = news_path.read_text()

          marker = "async function loadFeed(feed: Feed): Promise<{ items: NewsItem[]; health: SourceHealth }> {"
          helper = '''function sourceForFeed(value: unknown, feed: Feed) {
            const cleaned = clean(value, 100);
            if (cleaned) return canonicalSourceName(cleaned);
            return feed.sourceType === "direct" ? canonicalSourceName(feed.name) : "Unverified source";
          }

          '''
          if "function sourceForFeed(" not in news:
            if marker not in news:
              raise SystemExit("loadFeed marker not found")
            news = news.replace(marker, helper + marker, 1)

          old = '''      const sourceRaw = clean(item?.source?.["#text"] ?? item?.source ?? feed.name, 100) || feed.name;
                const source = canonicalSourceName(sourceRaw);'''
          new = '''      const sourceRaw = item?.source?.["#text"] ?? item?.source;
                const source = sourceForFeed(sourceRaw, feed);'''
          if old not in news:
            raise SystemExit("source fallback block not found")
          news = news.replace(old, new, 1)

          export_old = '''  safePublishedAt,
            inferCategory,'''
          export_new = '''  safePublishedAt,
            sourceForFeed,
            inferCategory,'''
          if "  sourceForFeed," not in news:
            if export_old not in news:
              raise SystemExit("__test export marker not found")
            news = news.replace(export_old, export_new, 1)
          news_path.write_text(news)

          test_path = Path("scripts/content-abuse.mjs")
          test = test_path.read_text()
          insert_marker = '''function article(title, description = title, source = "Reuters") {'''
          regression = '''const aggregatedReutersFeed = {
            name: "Reuters",
            sourceType: "aggregated",
            role: "wire",
            defaultCategory: "세계",
            scope: "world",
            url: "https://example.com/rss",
            weight: 1.35,
          };
          const directSbsFeed = {
            name: "SBS",
            sourceType: "direct",
            role: "broadcaster",
            defaultCategory: "국내",
            scope: "domestic",
            url: "https://example.com/rss",
            weight: 1,
          };
          check("aggregated item without publisher metadata is not attributed to trusted feed name",
            newsTest.sourceForFeed(undefined, aggregatedReutersFeed) === "Unverified source");
          check("direct publisher feed may fall back to its own publisher name",
            newsTest.sourceForFeed(undefined, directSbsFeed) === "SBS");
          check("aggregated item with explicit publisher metadata still keeps verified publisher label",
            newsTest.sourceForFeed("Reuters", aggregatedReutersFeed) === "Reuters");

          '''
          if "aggregated item without publisher metadata" not in test:
            if insert_marker not in test:
              raise SystemExit("content abuse insertion marker not found")
            test = test.replace(insert_marker, regression + insert_marker, 1)
          test_path.write_text(test)
          PY
      - name: Commit patch
        run: |
          git config user.name "maekrak-redteam"
          git config user.email "actions@users.noreply.github.com"
          git add lib/news.ts scripts/content-abuse.mjs
          git diff --cached --check
          git commit -m "Block trusted source fallback on aggregate feeds"
          git push
