name: redteam-self-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch publisher-bound identities and regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          news = Path('lib/news.ts')
          text = news.read_text()
          pattern = re.compile(r'''if \(allowedAggregator\) \{\n\s+if \(allowedAggregatorDomains\.some\(\(domain\) => hostMatches\(attributionUrl\.hostname, domain\)\)\) return "Unverified source";\n\s+return source;\n\s+\}\n\s+return samePublisherHostname\(hostname, attributionUrl\.hostname\) \? source : "Unverified source";''')
          replacement = '''if (allowedAggregator) {
        if (allowedAggregatorDomains.some((domain) => hostMatches(attributionUrl.hostname, domain))) return "Unverified source";
        return publisherHostnameKey(attributionUrl.hostname);
      }
      return samePublisherHostname(hostname, attributionUrl.hostname) ? publisherHostnameKey(hostname) : "Unverified source";'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'sourceForLink patch count={count}')
          news.write_text(text)

          p = Path('scripts/aggregator-unknown-source-attribution-abuse.mjs')
          text = p.read_text()
          text, count = re.subn(
              r'"unknown outlet on Google News wrapper with HTTPS publisher attribution remains named",\n\s+sourceForLink\("Example News", "https://news\.google\.com/rss/articles/example", "aggregated", "https://example\.com/news"\) === "Example News",',
              '"unknown outlet on Google News wrapper is bound to its HTTPS publisher hostname",\n    sourceForLink("Example News", "https://news.google.com/rss/articles/example", "aggregated", "https://example.com/news") === "example.com",',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'aggregator regression patch count={count}')
          p.write_text(text)

          p = Path('scripts/aggregated-direct-source-alias-abuse.mjs')
          text = p.read_text()
          text, count = re.subn(
              r'"matching publisher attribution can preserve an unknown direct-link outlet name",\n\s+sourceForLink\("Outlet Alpha", linkA, "aggregated", "https://publisher\.example/about"\) === "Outlet Alpha",',
              '"matching publisher attribution binds an unknown direct-link outlet to the publisher hostname",\n    sourceForLink("Outlet Alpha", linkA, "aggregated", "https://publisher.example/about") === "publisher.example",',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'direct-link regression patch count={count}')
          p.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/news.ts scripts/aggregator-unknown-source-attribution-abuse.mjs scripts/aggregated-direct-source-alias-abuse.mjs
          git commit -m "fix: bind unknown source identity to publisher hostname"
          git push origin HEAD:main
