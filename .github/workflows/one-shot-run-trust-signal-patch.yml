name: one-shot-run-trust-signal-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry verified trust-signal app patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-unverified-trust-signal-patch.mjs
      - name: Remove duplicate test export
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/news.ts')
          s = p.read_text()
          s = s.replace('  sourceBalancedMajority,\n  verifiedSourceArticles,\n  verifiedSourceCount,\n  importanceFor,\n  selectionReasons,\n  briefWatchFor,\n};', '  sourceBalancedMajority,\n  verifiedSourceArticles,\n  verifiedSourceCount,\n  importanceFor,\n  selectionReasons,\n};', 1)
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - run: node scripts/unverified-trust-signal-laundering-abuse.mjs
      - run: node scripts/content-abuse.mjs
      - run: npm run build
      - name: Commit verified app patch
        run: |
          git config user.name "seulkidesign-app"
          git config user.email "seulki.design@gmail.com"
          git add lib/news.ts app/page.tsx scripts/unverified-trust-signal-laundering-abuse.mjs
          git commit -m "Block unverified trust-signal laundering"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
