name: one-shot-korean-proper-name-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land code only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          const { __test } = await import('./lib/news.ts');
          const make = (title, source) => ({
            title, description: title, source, link: `https://example.com/${source}`,
            publishedAt: '2026-08-31T03:00:00Z', category: '경제', scope: 'domestic',
            sourceType: 'aggregated', sourceRole: source === 'Reuters' ? 'wire' : 'broadcaster',
          });
          const samsung = make('삼성전자 정부와 함께 차세대 배터리 생산 확대 계획 공식 발표 오늘 서울 행사', 'Reuters');
          const hyundai = make('현대자동차 정부와 함께 차세대 배터리 생산 확대 계획 공식 발표 오늘 서울 행사', 'KBS');
          if (!__test.sameEvent(samsung, hyundai)) throw new Error('Korean template collision no longer reproduces');
          console.log('REPRODUCED: different Korean companies collapse into one event');
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          let news = readFileSync('lib/news.ts', 'utf8');
          const oldBlock = `function properNameTokens(text: string) {
            const matches = clean(text).match(/\\b[A-Z][A-Za-z0-9&.-]{1,}\\b/g) ?? [];
            return new Set(matches.filter((word) => !genericTitleCaseWords.has(word)).map((word) => word.toLowerCase()));
          }`;
          const newBlock = `const koreanOrganizationSuffix = /(?:전자|자동차|하이닉스|그룹|은행|증권|보험|항공|제약|바이오|건설|화학|에너지|텔레콤|카드|캐피탈|금융|상사|중공업|조선|모비스|로보틱스)$/;
          const koreanGenericOrganizationPrefixes = /^(?:전기|수소|자율주행|친환경|승용|상용|소형|대형|국내|해외)$/;

          function properNameTokens(text: string) {
            const cleaned = clean(text);
            const english = cleaned.match(/\\b[A-Z][A-Za-z0-9&.-]{1,}\\b/g) ?? [];
            const korean = cleaned
              .split(/\\s+/)
              .map((word) => word.replace(/^[^가-힣A-Za-z0-9]+|[^가-힣A-Za-z0-9·&.-]+$/g, ""))
              .filter((word) => {
                if (!/[가-힣]/.test(word) || !koreanOrganizationSuffix.test(word)) return false;
                const stem = word.replace(koreanOrganizationSuffix, "");
                return stem.length >= 2 && !koreanGenericOrganizationPrefixes.test(stem);
              });
            return new Set([
              ...english.filter((word) => !genericTitleCaseWords.has(word)).map((word) => word.toLowerCase()),
              ...korean,
            ]);
          }`;
          if (!news.includes(oldBlock)) throw new Error('properNameTokens patch anchor not found');
          news = news.replace(oldBlock, newBlock);
          writeFileSync('lib/news.ts', news);

          const regression = `const failures = [];
          const passes = [];
          const { __test } = await import("../lib/news.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const make = (title, source = "Reuters") => ({
            title, description: title, source, link: "https://example.com/story", publishedAt: "2026-08-31T03:00:00Z",
            category: "경제", scope: "domestic", sourceType: "aggregated",
            sourceRole: source === "Reuters" ? "wire" : "broadcaster",
          });
          const samsung = make("삼성전자 정부와 함께 차세대 배터리 생산 확대 계획 공식 발표 오늘 서울 행사", "Reuters");
          const hyundai = make("현대자동차 정부와 함께 차세대 배터리 생산 확대 계획 공식 발표 오늘 서울 행사", "KBS");
          check("different Korean companies are recognized as conflicting proper names", __test.hasProperNameConflict(samsung.title, hyundai.title));
          check("different Korean companies are not merged despite template similarity", !__test.sameEvent(samsung, hyundai));
          const samsungBusan = make("삼성전자 정부와 함께 차세대 배터리 생산 확대 계획 공식 발표 오늘 부산 행사", "KBS");
          check("same Korean company remains mergeable across minor location wording", __test.sameEvent(samsung, samsungBusan));
          check("Samsung Electronics token is extracted", __test.properNameTokens(samsung.title).has("삼성전자"));
          check("Hyundai Motor token is extracted", __test.properNameTokens(hyundai.title).has("현대자동차"));
          const genericEv = __test.properNameTokens("전기자동차 시장 성장 전망과 배터리 가격 변화 분석");
          check("generic electric-car phrase is not treated as a company", !genericEv.has("전기자동차"));
          console.log("Korean proper-name template collision abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/korean-proper-name-collision-abuse.mjs', regression);
          EOF

          node scripts/korean-proper-name-collision-abuse.mjs
          node scripts/template-collision-abuse.mjs
          node scripts/cluster-bridge-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build

          git add lib/news.ts scripts/korean-proper-name-collision-abuse.mjs
          git commit -m "Prevent Korean company template collisions"
          git push origin HEAD:main
