name: one-shot-hardening-v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Apply timestamp hardening
        run: node scripts/apply-timezone-hardening.mjs
      - name: Apply unverified cluster hardening
        run: node scripts/apply-unverified-cluster-hardening.mjs
      - name: Verify new regressions
        run: |
          node scripts/timezone-less-published-at-abuse.mjs
          node scripts/ambiguous-timezone-abbreviation-abuse.mjs
          node scripts/unverified-cluster-poisoning-abuse.mjs
      - name: Verify related regressions
        run: |
          node scripts/cluster-bridge-abuse.mjs
          node scripts/content-abuse.mjs
          node scripts/calendar-rollover-abuse.mjs
          node scripts/timestamp-abuse.mjs
      - name: Production build
        run: npm run build
      - name: Land verified patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-hardening-v2.yml
          git add -A
          git commit -m "Harden publication timestamps and trusted event clustering"
          git push origin HEAD:main
