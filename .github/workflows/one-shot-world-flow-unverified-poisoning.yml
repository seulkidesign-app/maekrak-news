name: one-shot-world-flow-unverified-poisoning

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land app files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          const { buildWorldFlows } = await import('./lib/world-briefing.ts');
          const article = (title, source) => ({
            title, description: title, source, link: 'https://example.com/story',
            publishedAt: '2026-08-31T00:00:00Z', category: '세계', scope: 'world',
            sourceType: 'aggregated', sourceRole: source === 'Reuters' ? 'wire' : source === 'BBC' ? 'international' : 'other',
          });
          const event = (id, verifiedTitle, source) => ({
            id, title: verifiedTitle, category: '세계', scope: 'world', summary: verifiedTitle,
            publishedAt: '2026-08-31T00:00:00Z', dayStatus: 'today', importanceScore: 8,
            sourceCount: 1, whySelected: [], briefWhy: 'security', briefWatch: 'single-source',
            articles: [article(verifiedTitle, source), article('Iran regional security context injected by unknown publisher', 'Unverified source')],
          });
          const ukraine = event('ukraine-poison', 'Ukraine reports Russian missile attack near Kyiv', 'Reuters');
          const yemen = event('yemen-poison', 'Yemen militia launches missile in Red Sea', 'BBC');
          const flows = buildWorldFlows([ukraine, yemen], 'en');
          if (!flows.some((flow) => flow.code === 'security' && flow.eventIds.length === 2)) throw new Error('unverified world-flow poisoning did not reproduce');
          console.log('REPRODUCED: unverified article text manufactures a shared security flow');
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'lib/world-briefing.ts';
          let source = readFileSync(path, 'utf8');
          const oldBlock = `function eventText(event: NewsEvent) {
            return event.articles.map((article) => \`${'${article.title} ${article.description}'}\`).join(" ").toLowerCase();
          }`;
          const newBlock = `function eventText(event: NewsEvent) {
            return event.articles
              .filter((article) => canonicalSourceName(article.source) !== "Unverified source")
              .map((article) => \`${'${article.title} ${article.description}'}\`)
              .join(" ")
              .toLowerCase();
          }`;
          if (!source.includes(oldBlock)) throw new Error('world-flow eventText patch anchor not found');
          source = source.replace(oldBlock, newBlock);
          writeFileSync(path, source);

          const regression = `const failures = [];
          const passes = [];
          const { buildWorldFlows } = await import("../lib/world-briefing.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const article = (title, source) => ({ title, description: title, source, link: "https://example.com/story", publishedAt: "2026-08-31T00:00:00Z", category: "세계", scope: "world", sourceType: "aggregated", sourceRole: source === "Reuters" ? "wire" : source === "BBC" ? "international" : "other" });
          const event = (id, verifiedTitle, source, poison = null) => ({ id, title: verifiedTitle, category: "세계", scope: "world", summary: verifiedTitle, publishedAt: "2026-08-31T00:00:00Z", dayStatus: "today", importanceScore: 8, sourceCount: source === "Unverified source" ? 0 : 1, whySelected: [], briefWhy: "security", briefWatch: "single-source", articles: [article(verifiedTitle, source), ...(poison ? [article(poison, "Unverified source")] : [])] });
          const ukraine = event("ukraine", "Ukraine reports Russian missile attack near Kyiv", "Reuters", "Iran regional security context injected by unknown publisher");
          const yemen = event("yemen", "Yemen militia launches missile in Red Sea", "BBC", "Iran regional security context injected by unknown publisher");
          const poisoned = buildWorldFlows([ukraine, yemen], "en");
          check("unverified Iran injection cannot manufacture a shared security flow", !poisoned.some((flow) => flow.code === "security" && flow.eventIds.length === 2));
          const iranA = event("iran-a", "Iran and Israel discuss ceasefire after regional attacks", "Reuters");
          const iranB = event("iran-b", "Hormuz shipping risk rises as Iran tensions continue", "BBC");
          const genuine = buildWorldFlows([iranA, iranB], "en");
          check("verified shared regional thread still forms a security flow", genuine.some((flow) => flow.code === "security" && flow.eventIds.length === 2));
          const unknownA = event("unknown-a", "Iran ceasefire talks continue", "Unverified source");
          const unknownB = event("unknown-b", "Iran sanctions talks continue", "Unverified source");
          check("unverified-only events cannot manufacture a world flow", buildWorldFlows([unknownA, unknownB], "en").length === 0);
          console.log("World-flow unverified poisoning abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/world-flow-unverified-poisoning-abuse.mjs', regression);
          EOF

          node scripts/world-flow-unverified-poisoning-abuse.mjs
          node scripts/content-abuse.mjs
          node scripts/korea-impact-poisoning-abuse.mjs
          npm run build

          git add lib/world-briefing.ts scripts/world-flow-unverified-poisoning-abuse.mjs
          git commit -m "Exclude unverified text from world-flow signatures"
          git push origin HEAD:main
