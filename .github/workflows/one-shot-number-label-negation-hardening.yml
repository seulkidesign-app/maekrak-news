name: one-shot-number-label-negation-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          const { auditEventAccuracy } = await import('./lib/accuracy.ts');
          const article = (title, source) => ({ title, description: title, source, link: 'https://example.com/story', publishedAt: '2026-08-31T00:00:00Z', category: '경제', scope: 'world', sourceType: 'aggregated', sourceRole: source === 'Reuters' ? 'wire' : 'international' });
          const event = { id: 'no-label-repro', title: 'Ranking', category: '경제', scope: 'world', summary: '', publishedAt: '2026-08-31T00:00:00Z', dayStatus: 'today', articles: [article('Company ranked No. 5 globally', 'Reuters'), article('Company ranked fifth globally', 'BBC')], sourceCount: 2, importanceScore: 7, whySelected: [], briefWhy: 'economy', briefWatch: 'follow-up' };
          const audit = auditEventAccuracy(event);
          if (!audit.negationDifference) throw new Error('No.-label false positive did not reproduce');
          console.log('REPRODUCED: No. 5 ranking label is misread as negation');
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          let accuracy = readFileSync('lib/accuracy.ts', 'utf8');
          const may = 'const MAY_DATE = /\\bMay\\s+(?:0?[1-9]|[12]\\d|3[01])(?:,\\s*(?:19|20)\\d{2})?\\b|\\b(?:0?[1-9]|[12]\\d|3[01])\\s+May(?:\\s+(?:19|20)\\d{2})?\\b/gi;';
          const numberLabel = 'const NUMBER_LABEL = /\\bNo\\.?\\s*(?=\\d)/gi;';
          if (!accuracy.includes(numberLabel)) {
            if (!accuracy.includes(may)) throw new Error('MAY_DATE anchor not found');
            accuracy = accuracy.replace(may, `${may}\n${numberLabel}`);
          }
          const oldNegation = 'function isNegatedText(text:string){return NEGATION.test(text);}';
          const newNegation = 'function isNegatedText(text:string){return NEGATION.test(text.replace(NUMBER_LABEL," "));}';
          if (!accuracy.includes(oldNegation) && !accuracy.includes(newNegation)) throw new Error('isNegatedText anchor not found');
          accuracy = accuracy.replace(oldNegation, newNegation);
          writeFileSync('lib/accuracy.ts', accuracy);

          const regression = `const failures = [];
          const passes = [];
          const { auditEventAccuracy } = await import("../lib/accuracy.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const article = (title, source) => ({ title, description: title, source, link: "https://example.com/story", publishedAt: "2026-08-31T00:00:00Z", category: "경제", scope: "world", sourceType: "aggregated", sourceRole: source === "Reuters" ? "wire" : "international" });
          const event = (...articles) => ({ id: "number-label", title: articles[0]?.title ?? "", category: "경제", scope: "world", summary: "", publishedAt: "2026-08-31T00:00:00Z", dayStatus: "today", articles, sourceCount: articles.length, importanceScore: 7, whySelected: [], briefWhy: "economy", briefWatch: "follow-up" });
          const rank = auditEventAccuracy(event(article("Company ranked No. 5 globally", "Reuters"), article("Company ranked fifth globally", "BBC")));
          check("No. 5 ranking label does not create negation disagreement", !rank.negationDifference && rank.negationExamples.every((item) => !item.negated));
          const rankNoDot = auditEventAccuracy(event(article("Team is No 1 in exports", "Reuters"), article("Team is number one in exports", "BBC")));
          check("No 1 label without a period is not treated as negation", !rankNoDot.negationDifference && rankNoDot.negationExamples.every((item) => !item.negated));
          const realNo = auditEventAccuracy(event(article("Government says no agreement was reached", "Reuters"), article("Government says agreement was reached", "BBC")));
          check("real no negation still triggers a disagreement", realNo.negationDifference);
          const realNot = auditEventAccuracy(event(article("Company did not approve the merger", "Reuters"), article("Company approved the merger", "BBC")));
          check("existing not-negation detection remains active", realNot.negationDifference);
          console.log("Number-label negation ambiguity abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/number-label-negation-abuse.mjs', regression);
          EOF

          node scripts/number-label-negation-abuse.mjs
          node scripts/negation-disagreement-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build

          git add lib/accuracy.ts scripts/number-label-negation-abuse.mjs
          git commit -m "Avoid negation false positives for numbered labels"
          git push origin HEAD:main
