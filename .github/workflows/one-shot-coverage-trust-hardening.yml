name: one-shot-coverage-trust-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Reproduce, patch, regress, build, and land
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('lib/news.ts', 'utf8');
          const countsRawEvents = /const categoryCoverage:[\s\S]*?events\.filter\(\(event\) => event\.scope === "domestic"\)\.length[\s\S]*?events\.filter\(\(event\) => event\.category === "재난"\)\.length/.test(source);
          if (!countsRawEvents) throw new Error('Coverage attack no longer reproduces or source shape changed');
          if (/function categoryCoverageFor\(/.test(source)) throw new Error('Coverage hardening already exists');
          console.log('REPRODUCED: unverified-only events can inflate topic coverage counts');
          EOF

          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          let news = readFileSync('lib/news.ts', 'utf8');
          const block = /  const categoryCoverage: Record<NewsCategory, number> = \{\n    국내: events\.filter\(\(event\) => event\.scope === "domestic"\)\.length,\n    세계: events\.filter\(\(event\) => event\.scope === "world"\)\.length,\n    정치: events\.filter\(\(event\) => event\.category === "정치"\)\.length,\n    사회: events\.filter\(\(event\) => event\.category === "사회"\)\.length,\n    경제: events\.filter\(\(event\) => event\.category === "경제"\)\.length,\n    기술: events\.filter\(\(event\) => event\.category === "기술"\)\.length,\n    재난: events\.filter\(\(event\) => event\.category === "재난"\)\.length,\n  \};/;
          if (!block.test(news)) throw new Error('categoryCoverage block anchor not found');
          const helper = `function categoryCoverageFor(events: NewsEvent[]): Record<NewsCategory, number> {
            const verifiedEvents = events.filter((event) => event.sourceCount > 0);
            return {
              국내: verifiedEvents.filter((event) => event.scope === "domestic").length,
              세계: verifiedEvents.filter((event) => event.scope === "world").length,
              정치: verifiedEvents.filter((event) => event.category === "정치").length,
              사회: verifiedEvents.filter((event) => event.category === "사회").length,
              경제: verifiedEvents.filter((event) => event.category === "경제").length,
              기술: verifiedEvents.filter((event) => event.category === "기술").length,
              재난: verifiedEvents.filter((event) => event.category === "재난").length,
            };
          }

          `;
          const insertAnchor = 'export async function getBriefing(): Promise<Briefing> {';
          if (!news.includes(insertAnchor)) throw new Error('getBriefing anchor not found');
          news = news.replace(insertAnchor, helper + insertAnchor);
          news = news.replace(block, '  const categoryCoverage = categoryCoverageFor(events);');
          if (!news.includes('  categoryCoverageFor,')) {
            const exportAnchor = '  clusterNewsItems,\n';
            if (!news.includes(exportAnchor)) throw new Error('__test export anchor not found');
            news = news.replace(exportAnchor, exportAnchor + '  categoryCoverageFor,\n');
          }
          writeFileSync('lib/news.ts', news);

          const regression = `const failures = [];
          const passes = [];
          const { __test } = await import("../lib/news.ts");
          function check(name, condition) { if (condition) passes.push(name); else failures.push(name); }
          const event = (id, category, scope, sourceCount) => ({
            id, title: id, category, scope, summary: id,
            publishedAt: "2026-08-30T10:00:00Z", dayStatus: "today", articles: [], sourceCount,
            importanceScore: 1, whySelected: [], briefWhy: "broad-impact", briefWatch: "single-source",
          });
          const poisoned = __test.categoryCoverageFor([
            event("verified-economy", "경제", "domestic", 1),
            event("unknown-disaster", "재난", "world", 0),
          ]);
          check("verified domestic event counts toward domestic coverage", poisoned.국내 === 1);
          check("verified economy event counts toward economy coverage", poisoned.경제 === 1);
          check("unverified world event cannot fake world coverage", poisoned.세계 === 0);
          check("unverified disaster event cannot hide a disaster coverage gap", poisoned.재난 === 0);
          const mixed = __test.categoryCoverageFor([
            event("verified-world-disaster", "재난", "world", 2),
            event("unknown-politics", "정치", "domestic", 0),
          ]);
          check("verified world disaster still counts", mixed.세계 === 1 && mixed.재난 === 1);
          check("unverified politics does not inflate politics or domestic coverage", mixed.정치 === 0 && mixed.국내 === 0);
          const singleVerified = __test.categoryCoverageFor([event("mixed-source-event", "기술", "world", 1)]);
          check("an event with at least one verified source remains visible in coverage", singleVerified.기술 === 1 && singleVerified.세계 === 1);
          console.log("Coverage trust poisoning abuse: " + passes.length + " passed / " + failures.length + " failed");
          passes.forEach((name) => console.log("PASS  " + name));
          failures.forEach((name) => console.error("FAIL  " + name));
          if (failures.length) process.exit(1);
          `;
          writeFileSync('scripts/coverage-trust-poisoning-abuse.mjs', regression);
          EOF

          node scripts/coverage-trust-poisoning-abuse.mjs
          node scripts/unverified-trust-signal-laundering-abuse.mjs
          node scripts/world-flow-unverified-poisoning-abuse.mjs
          node scripts/content-abuse.mjs
          npm run build

          git add lib/news.ts scripts/coverage-trust-poisoning-abuse.mjs
          git commit -m "Exclude unverified-only events from coverage signals"
          git push origin HEAD:main
