name: redteam-placeholder-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch terminal unverified source state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/news.ts')
          text = p.read_text()
          old = '''function sourceForLink(source: string, link: string, sourceType: Feed["sourceType"], sourceAttributionUrl = "") {
  const trustedDomains = trustedSourceDomains[source];
  try {'''
          new = '''function sourceForLink(source: string, link: string, sourceType: Feed["sourceType"], sourceAttributionUrl = "") {
  const trustedDomains = trustedSourceDomains[source];
  if (source === "Unverified source") return "Unverified source";
  try {'''
          if old not in text:
              raise SystemExit('sourceForLink insertion target not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/news.ts
          git commit -m "fix: keep unverified source terminal after attribution"
          git push origin HEAD:main
