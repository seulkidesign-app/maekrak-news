name: redteam-placeholder-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch terminal unverified source state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/news.ts')
          text = p.read_text()
          needle = '  const trustedDomains = trustedSourceDomains[source];\n  try {'
          replacement = '  const trustedDomains = trustedSourceDomains[source];\n  if (source === "Unverified source") return "Unverified source";\n  try {'
          if needle not in text:
              raise SystemExit('patch target not found')
          p.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/news.ts
          git commit -m "fix: keep unverified source terminal after attribution"
          git push origin HEAD:main
