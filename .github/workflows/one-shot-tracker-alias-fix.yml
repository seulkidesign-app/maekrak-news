name: tracker-alias-fix

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()
          old = '/^(?:gclid|fbclid|mc_cid|mc_eid)$/i.test(key)'
          new = '/^(?:gclid|gbraid|wbraid|fbclid|msclkid|dclid|twclid|igshid|_gl|mc_cid|mc_eid)$/i.test(key)'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          node scripts/tracker-alias-dedupe-abuse.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- lib/news.ts; then exit 0; fi
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add lib/news.ts
          git commit -m "fix: dedupe common tracker aliases"
          git push origin HEAD:main
