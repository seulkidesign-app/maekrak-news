name: timezone-less-published-at-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Confirm timezone-less timestamp attack reproduces
        run: node --input-type=module -e "const {__test}=await import('./lib/news.ts'); const now=Date.UTC(2026,7,30,12); if(__test.safePublishedAt('2026-08-30T10:00:00',now)==='') process.exit(1); console.log('REPRODUCED timezone-less timestamp acceptance');"
      - name: Apply hardening
        run: node scripts/apply-timezone-hardening.mjs
      - name: Focused regressions
        run: |
          node scripts/timezone-less-published-at-abuse.mjs
          node scripts/calendar-rollover-abuse.mjs
          node scripts/timestamp-abuse.mjs
          npm run build
      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject timezone-less publication timestamps"
          git pull --rebase origin main
          git push origin HEAD:main
