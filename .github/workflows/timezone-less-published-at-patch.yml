name: timezone-less-published-at-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Apply, verify, and push against latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            echo "=== attempt ${attempt} ==="
            git fetch origin main
            git reset --hard origin/main

            if grep -q "function hasExplicitTimezoneForTimestamp" lib/news.ts; then
              echo "Timezone hardening already landed; verifying latest main."
              node scripts/timezone-less-published-at-abuse.mjs
              node scripts/ambiguous-timezone-abbreviation-abuse.mjs
              node scripts/calendar-rollover-abuse.mjs
              node scripts/timestamp-abuse.mjs
              npm run build
              exit 0
            fi

            node --input-type=module -e "const {__test}=await import('./lib/news.ts'); const now=Date.UTC(2026,7,30,12); if(__test.safePublishedAt('2026-08-30T10:00:00',now)==='') process.exit(1); console.log('REPRODUCED timezone-less timestamp acceptance');"

            node scripts/apply-timezone-hardening.mjs
            node scripts/timezone-less-published-at-abuse.mjs
            node scripts/ambiguous-timezone-abbreviation-abuse.mjs
            node scripts/calendar-rollover-abuse.mjs
            node scripts/timestamp-abuse.mjs
            npm run build

            git add -A
            git commit -m "Reject ambiguous RSS publication timezones"
            if git push origin HEAD:main; then
              echo "Patch pushed successfully."
              exit 0
            fi

            echo "Concurrent main update detected; retrying from latest main."
            sleep 2
          done

          echo "Failed to land verified patch after retries."
          exit 1
