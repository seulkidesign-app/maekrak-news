name: orchid-ipv6-repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'reject ORCHID IPv6 article links') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ORCHID trust boundary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'lib/news.ts';
          let text = fs.readFileSync(path, 'utf8');
          const needle = '  if (/^2001:2(?::|$)/i.test(host)) return true;';
          const replacement = `${needle}\n  if (/^2001:(?:1[0-9a-f]|2[0-9a-f])(?::|$)/i.test(host)) return true;`;
          if (text.includes('(?:1[0-9a-f]|2[0-9a-f])')) process.exit(0);
          if (!text.includes(needle)) {
            console.error('Expected IPv6 trust-boundary anchor not found');
            process.exit(1);
          }
          fs.writeFileSync(path, text.replace(needle, replacement));
          NODE
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/news.ts
          git commit -m "fix: reject ORCHID IPv6 article links"
          git push
