name: apply-cluster-bridge-fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-cluster-bridge-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Patch clustering to require pairwise consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()

          old = '''  const clusters: NewsItem[][] = [];
          for (const item of news) {
            const match = clusters.find((cluster) => cluster.length > 0 && sameEvent(cluster[0], item));
            if (match) match.push(item);
            else clusters.push([item]);
          }
          '''
          new = '''  const clusters = clusterNewsItems(news);
          '''
          if old not in text:
              raise SystemExit('expected legacy clustering loop not found')
          text = text.replace(old, new, 1)

          marker = '''export function getDisplayArticle(event: NewsEvent, lang: "ko" | "en") {'''
          helper = '''function clusterNewsItems(items: NewsItem[]) {
            const clusters: NewsItem[][] = [];
            for (const item of items) {
              const match = clusters.find((cluster) => cluster.length > 0 && cluster.every((member) => sameEvent(member, item)));
              if (match) match.push(item);
              else clusters.push([item]);
            }
            return clusters;
          }

          '''
          if marker not in text:
              raise SystemExit('getDisplayArticle marker not found')
          text = text.replace(marker, helper + marker, 1)

          export_marker = '''  sameEvent,
            stableEventId,'''
          if export_marker not in text:
              raise SystemExit('__test export marker not found')
          text = text.replace(export_marker, '''  sameEvent,
            clusterNewsItems,
            stableEventId,''', 1)

          path.write_text(text)
          PY
      - name: Verify bridge poisoning regression
        run: node scripts/cluster-bridge-abuse.mjs
      - name: Verify production build
        run: npm run build
      - name: Commit permanent fix and remove one-shot workflow
        run: |
          git config user.name "seulkidesign-app"
          git config user.email "seulki.design@gmail.com"
          git rm .github/workflows/apply-cluster-bridge-fix.yml
          git add lib/news.ts scripts/cluster-bridge-abuse.mjs .github/workflows/adversarial-e2e.yml
          git commit -m "Block bridge-headline cluster poisoning"
          git push origin HEAD:main
