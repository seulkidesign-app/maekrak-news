name: apply-cluster-bridge-fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-cluster-bridge-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Patch clustering to require pairwise consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/news.ts')
          text = path.read_text()

          pattern = re.compile(
              r'\n\s*const clusters: NewsItem\[\]\[\] = \[\];\n'
              r'\s*for \(const item of news\) \{\n'
              r'\s*const match = clusters\.find\(\(cluster\) => cluster\.length > 0 && sameEvent\(cluster\[0\], item\)\);\n'
              r'\s*if \(match\) match\.push\(item\);\n'
              r'\s*else clusters\.push\(\[item\]\);\n'
              r'\s*\}\n'
          )
          text, count = pattern.subn('\n  const clusters = clusterNewsItems(news);\n', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one legacy clustering loop, found {count}')

          marker = 'export function getDisplayArticle(event: NewsEvent, lang: "ko" | "en") {'
          helper = '''function clusterNewsItems(items: NewsItem[]) {
            const clusters: NewsItem[][] = [];
            for (const item of items) {
              const match = clusters.find((cluster) => cluster.length > 0 && cluster.every((member) => sameEvent(member, item)));
              if (match) match.push(item);
              else clusters.push([item]);
            }
            return clusters;
          }

          '''
          if marker not in text:
              raise SystemExit('getDisplayArticle marker not found')
          text = text.replace(marker, helper + marker, 1)

          text, count = re.subn(r'(\n\s*sameEvent,\n)(\s*stableEventId,)', r'\1  clusterNewsItems,\n\2', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one __test export marker, found {count}')

          path.write_text(text)
          PY
      - name: Verify bridge poisoning regression
        run: node scripts/cluster-bridge-abuse.mjs
      - name: Verify production build
        run: npm run build
      - name: Commit permanent fix and remove one-shot workflow
        run: |
          git config user.name "seulkidesign-app"
          git config user.email "seulki.design@gmail.com"
          git rm .github/workflows/apply-cluster-bridge-fix.yml
          git add lib/news.ts scripts/cluster-bridge-abuse.mjs .github/workflows/adversarial-e2e.yml
          git commit -m "Block bridge-headline cluster poisoning"
          git push origin HEAD:main
