name: directional-id-hotfix

on:
  push:
    paths:
      - ".github/workflows/directional-id-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reproduce directional ID collision
        run: |
          if node scripts/directional-event-id-collision-abuse.mjs; then
            echo "Expected the new regression to fail before the fix"
            exit 1
          fi
      - name: Patch stable event identity
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()
          old = '''function stableEventId(articles: NewsItem[]) { const verified = verifiedSourceArticles(articles); const identityPool = verified.length ? verified : articles; const earliest = [...identityPool].sort((a, b) => new Date(a.publishedAt).getTime() - new Date(b.publishedAt).getTime())[0]; const anchor = earliest?.title ?? identityPool[0]?.title ?? "event"; const entities = [...normalizedEntities(anchor)].sort(); const actions = [...normalizedActions(anchor)].sort(); const anchorTokens = [...tokens(anchor)].sort().slice(0, 12); const fingerprint = [entities.join(","), actions.join(","), anchorTokens.join(",")].filter(Boolean).join("|") || normalizePhrase(anchor); return `evt_${stableHash(fingerprint)}`; }'''
          new = '''function stableEventId(articles: NewsItem[]) { const verified = verifiedSourceArticles(articles); const identityPool = verified.length ? verified : articles; const earliest = [...identityPool].sort((a, b) => new Date(a.publishedAt).getTime() - new Date(b.publishedAt).getTime())[0]; const anchor = earliest?.title ?? identityPool[0]?.title ?? "event"; const entities = [...normalizedEntities(anchor)].sort(); const actions = [...normalizedActions(anchor)].sort(); const direction = directionalEntityRelation(anchor); const directionKey = direction ? `${direction[0]}>${direction[1]}` : ""; const anchorTokens = [...tokens(anchor)].sort().slice(0, 12); const fingerprint = [entities.join(","), actions.join(","), directionKey, anchorTokens.join(",")].filter(Boolean).join("|") || normalizePhrase(anchor); return `evt_${stableHash(fingerprint)}`; }'''
          if old not in text:
              raise SystemExit('stableEventId target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify regression
        run: node scripts/directional-event-id-collision-abuse.mjs
      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/news.ts
          git commit -m "fix: distinguish directional event identities"
          git push origin HEAD:main
