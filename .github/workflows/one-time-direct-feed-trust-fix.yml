name: one-time-direct-feed-trust-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch direct-feed source trust boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/news.ts')
          text = path.read_text()
          old = '''    if (!trustedDomains) {
                if (!allowedAggregator) return source;'''.replace('                ', '      ')
          new = '''    if (!trustedDomains) {
                if (sourceType === "direct") return "Unverified source";
                if (!allowedAggregator) return source;'''.replace('                ', '      ')
          if old not in text:
              raise SystemExit('target sourceForLink trust block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/one-time-direct-feed-trust-fix.yml
          git config user.name "maekrak-redteam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/news.ts
          git commit -m "fix: reject unknown direct-feed source claims"
          git push origin HEAD:main
